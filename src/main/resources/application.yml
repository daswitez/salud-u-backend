spring:
  application:
    name: salud-u-backend
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/salud_u}
    username: ${DB_APP_USER:salud_u_runtime}
    password: ${DB_APP_PASSWORD}
    hikari:
      # Ante una caída de PostgreSQL las solicitudes fallan en segundos (RNF-07) en lugar de esperar 30 s por una conexión.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      data-source-properties:
        currentSchema: salud_u
        connectTimeout: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.default_schema: salud_u
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: ${DB_URL:jdbc:postgresql://localhost:5432/salud_u}
    user: ${DB_MIGRATOR_USER:salud_u_migrator}
    password: ${DB_MIGRATOR_PASSWORD}
    schemas: salud_u
    default-schema: salud_u
    create-schemas: true
    clean-disabled: true
    placeholders:
      runtime_role: ${DB_APP_USER:salud_u_runtime}
      migrator_role: ${DB_MIGRATOR_USER:salud_u_migrator}
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        # Esta sesión HTTP sólo guarda CSRF. La cookie SALUD_U_SESSION pertenece
        # exclusivamente a la sesión opaca persistente de la aplicación.
        name: SALUD_U_CSRF
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
salud-u:
  auth:
    session-ttl: 8h
    cookie-secure: ${SESSION_COOKIE_SECURE:true}
  documents:
    root: ${DOCUMENTS_ROOT:./var/clinical-documents}
