          maxItems: 20
          items:
            type: object
            required: [doseNumber, minimumIntervalDays]
            properties:
              doseNumber: {type: integer, minimum: 1, maximum: 20}
              minimumIntervalDays: {type: integer, minimum: 0, maximum: 3650}
