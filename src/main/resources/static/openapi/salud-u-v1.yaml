    VaccinationApplicationRequest:
      type: object
      required: [patientId, vaccineId, doseNumber, appliedOn, lot]
      properties:
        patientId: {type: string, format: uuid}
        vaccineId: {type: string, format: uuid}
        doseNumber: {type: integer, minimum: 1, maximum: 20}
        appliedOn: {type: string, format: date}
        lot: {type: string, minLength: 1, maxLength: 100}
        applicatorStaffId: {type: string, format: uuid, description: Obligatorio para Administración; un médico sólo puede indicar su propio personal.}
        intervalOverrideJustification: {type: string, minLength: 1, maxLength: 500, description: Obligatoria si no se cumple el intervalo mínimo.}
    LegacyVaccinationContextSuccess:
      type: object
      required: [ok, data, error]
      properties:
        ok: {type: boolean, const: true}
        data:
          type: object
          required: [patientId, carnet, fullName, today, ownApplicatorStaffId, applicators, vaccines]
          properties:
            patientId: {type: string, format: uuid}
            carnet: {type: string}
            fullName: {type: string}
            today: {type: string, format: date, description: Día actual en Bolivia.}
            ownApplicatorStaffId: {type: [string, 'null'], format: uuid, description: Personal del médico actor; null para Administración.}
            applicators: {type: array, items: {type: object, required: [staffId, name, staffCode]}}
            vaccines:
              type: array
              items:
                type: object
                required: [vaccineId, code, name, active, schemaVersion, doses, nextDoseNumber, appliedDoses]
                properties:
                  schemaVersion: {type: [integer, 'null']}
                  nextDoseNumber: {type: [integer, 'null'], description: Null si el esquema está completo o la vacuna inactiva.}
                  appliedDoses: {type: array, items: {type: object, required: [id, doseNumber, appliedOn, lot, schemaVersion, applicator, registeredBy, intervalWarning, intervalJustification, recordedAt]}}
        error: {type: 'null'}
    LegacyVaccinationApplicationSuccess:
      type: object
      required: [ok, data, error]
      properties:
        ok: {type: boolean, const: true}
        data:
          type: object
          required: [id, intervalWarning, applicatorStaffId, registeredBy, appliedOn]
          properties:
            id: {type: string, format: uuid}
            intervalWarning: {type: boolean}
            applicatorStaffId: {type: string, format: uuid}
            registeredBy: {type: string, format: uuid}
            appliedOn: {type: string, format: date}
