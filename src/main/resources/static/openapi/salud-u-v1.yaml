            vaccines: {type: array, items: {type: object, required: [vaccineId, code, name, active, currentSchemaVersion, requiredDoseCount, completedDoseCount, status, appliedDoses], properties: {status: {enum: [PENDING, PARTIAL, COMPLETE, INACTIVE]}, appliedDoses: {type: array, items: {type: object, required: [doseNumber, appliedOn, schemaVersion, lot, applicatorName]}}}}}
        error: {type: 'null'}
