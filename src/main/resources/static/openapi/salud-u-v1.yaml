    ScheduleSuggestion:
      type: object
      required: [id, type, date, specialtyId, specialtyName, staffId, staffName, suggestedValue, explanation, modelVersion, expiresAt, status, createdAt, updatedAt, decision]
      properties:
        id: {type: string, format: uuid}
        type: {type: string, enum: [DAY_SLOTS, OVERBOOKING, CAPACITY_ALERT, REQUEST_SLOT, RESCHEDULE]}
        date: {type: string, format: date}
        specialtyId: {type: [string, 'null'], format: uuid, description: null es el área (revisión inicial)}
        specialtyName: {type: [string, 'null']}
        staffId: {type: [string, 'null'], format: uuid, description: null en CAPACITY_ALERT}
        staffName: {type: [string, 'null']}
        suggestedValue:
          type: object
          description: |
            DAY_SLOTS: capacity, suggestedAppointments, saturationRisk, maxSaturationRisk, estimatedAttendance.
            OVERBOOKING: lo anterior más overbooking y slots [{slotId, startsAt, currentCapacity, suggestedCapacity}].
            CAPACITY_ALERT: from, to, businessDays, pendingRequests, estimatedDemand, projectedDemand,
            publishedPlaces, freePlaces, percentage (null sin lugares libres), demandExceedsSupply, daysWithoutEstimate.
        explanation: {type: string, description: Texto en español con los datos y la regla que sustentan la sugerencia (RNF-13)}
        modelVersion: {type: string}
        expiresAt: {type: string, format: date-time}
        status: {type: string, enum: [PENDING, ACCEPTED, MODIFIED, REJECTED, EXPIRED]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        decision:
          type: [object, 'null']
          description: null mientras está PENDING
          required: [decidedAt, decidedBy, decidedByName, reason, appliedValue]
          properties:
            decidedAt: {type: string, format: date-time}
            decidedBy: {type: [string, 'null'], format: uuid, description: null en EXPIRED}
            decidedByName: {type: [string, 'null']}
            reason: {type: [string, 'null']}
            appliedValue: {type: [object, 'null'], description: 'OVERBOOKING aplicado: capacity, overbooking, slots [{slotId, startsAt, currentCapacity, appliedCapacity}]'}
