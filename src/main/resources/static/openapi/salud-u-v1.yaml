openapi: 3.1.0
info:
  title: Salud-U API
  version: 1.0.0-draft
  description: |
    Contrato base de la API Spring. Publica rutas de compatibilidad /api para el
    frontend Next actual y contratos versionados /api/v1 para identidad y
    administración. Las rutas de compatibilidad se comparan con los fixtures de
    docs/reference-t01 antes de cada migración funcional.
servers:
  - url: http://localhost:8080
paths:
  /api/notifications:
    get:
      summary: Bandeja propia con cursor y contador de no leídos
      description: |
        Cualquier sesión autenticada. Solo avisos propios DELIVERED/READ cuya
        programación y entrega ya vencieron. Un APPOINTMENT_REMINDER o un
        APPOINTMENT_REMINDER_REINFORCED (el mismo día, cuando la asistencia estimada es
        menor al 70 %) solo aparece mientras su cita sigue programada para la fecha que anuncia. Orden deliveredAt DESC, id DESC.
        El cursor conserva microsegundos y se devuelve en pagination.nextCursor.
        unreadCount cuenta todas las no leídas visibles, no solo la página.
        Página y contador se leen en la misma instantánea. Las reprogramaciones
        actualizan el mismo ID y su entrega; vuelven a los más recientes al recargar.
        No admite elegir destinatario ni consulta individual por ID.
      security: [{sessionCookie: []}]
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {in: query, name: before, description: Cursor opaco entregado por la página anterior (fecha ISO con offset y UUID separados por barra vertical), schema: {type: string, maxLength: 120}}
      responses:
        '200':
          description: Bandeja propia; lista vacía y cero son resultados válidos. Cache-Control no-store, private.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationPage'}
        '400': {$ref: '#/components/responses/NotificationInvalid'}
        '401': {$ref: '#/components/responses/NotificationUnauthenticated'}
        '500': {$ref: '#/components/responses/NotificationFailure'}
  /api/notifications/{id}/read:
    patch:
      summary: Marcar un aviso propio como leído
      description: Idempotente; conserva readAt al repetir. La escritura y su auditoría son atómicas. Requiere CSRF.
      security: [{sessionCookie: [], csrfSession: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Aviso propio con status READ. Cache-Control no-store, private.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: {type: boolean, const: true}
                  data: {$ref: '#/components/schemas/Notification'}
        '400': {$ref: '#/components/responses/NotificationInvalid'}
        '401': {$ref: '#/components/responses/NotificationUnauthenticated'}
        '403': {description: CSRF ausente o inválido; error legacy de texto}
        '404':
          description: Aviso ajeno, inexistente o aún no entregado; mismo cuerpo sin revelar existencia.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationError'}
              example: {ok: false, error: Notificación no encontrada.}
        '500': {$ref: '#/components/responses/NotificationFailure'}
  /api/consent-texts:
    get:
      summary: Textos vigentes para el alta administrativa antes de crear el paciente
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Versiones y textos vigentes; Cache-Control no-store y private.}
        '401': {description: Sesión ausente.}
        '403': {description: Requiere rol ADMINISTRATIVE.}
  /api/me/consents:
    get:
      summary: Estado de los términos de uso y del consentimiento para investigación (A-03)
      description: 'Solo STUDENT, sobre su propia ficha. Incluye el texto y la versión vigentes de cada uno. pending=true mientras falte responder alguno en su versión vigente. Cache-Control no-store, private.'
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Estado vigente, content: {application/json: {schema: {$ref: '#/components/schemas/ConsentStatusSuccess'}}}}
        '403': {description: Rol distinto de STUDENT.}
        '404': {description: La cuenta no tiene una ficha de paciente vigente.}
    post:
      summary: Responder o cambiar la respuesta desde el portal (A-03)
      description: 'Solo STUDENT y siempre sobre su propia ficha: un patientId en el cuerpo se ignora. Solo se insertan las respuestas que cambian; cada una se audita como CONSENTIMIENTO_REGISTRADO con vía PORTAL. Requiere CSRF.'
      security: [{sessionCookie: [], csrfSession: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ConsentAnswer'}}}
      responses:
        '200': {description: Estado después de responder, content: {application/json: {schema: {$ref: '#/components/schemas/ConsentStatusSuccess'}}}}
        '400': {description: Términos no aceptados, investigación sin elegir Sí o No, o versiones ausentes.}
        '403': {description: Rol distinto de STUDENT o CSRF ausente.}
        '404': {description: La cuenta no tiene una ficha de paciente vigente.}
        '409': {description: Las versiones enviadas ya no son las vigentes; hay que volver a mostrar los textos.}
  /api/patients/{patientId}/consents:
    get:
      summary: Estado de consentimiento de un paciente (A-03, Administración)
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/PatientId'
      responses:
        '200': {description: Estado vigente, content: {application/json: {schema: {$ref: '#/components/schemas/ConsentStatusSuccess'}}}}
        '403': {description: Rol distinto de ADMINISTRATIVE.}
        '404': {description: Estudiante no encontrado.}
    post:
      summary: Registrar la respuesta que el paciente da en recepción (A-03, Administración)
      description: 'Mismo cuerpo que /api/me/consents. Se audita como CONSENTIMIENTO_REGISTRADO con vía ADMINISTRACION. Requiere CSRF.'
      security: [{sessionCookie: [], csrfSession: []}]
      parameters:
        - $ref: '#/components/parameters/PatientId'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ConsentAnswer'}}}
      responses:
        '200': {description: Estado después de responder, content: {application/json: {schema: {$ref: '#/components/schemas/ConsentStatusSuccess'}}}}
        '400': {description: Términos no aceptados o investigación sin elegir Sí o No.}
        '403': {description: Rol distinto de ADMINISTRATIVE o CSRF ausente.}
        '404': {description: Estudiante no encontrado.}
        '409': {description: Las versiones enviadas ya no son las vigentes.}
  /api/me/emergency-contact:
    get:
      summary: Contacto de emergencia de la ficha propia (A-02)
      description: 'Solo rol STUDENT. data es null si aún no lo registró. Cache-Control no-store, private.'
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Contacto propio o null, content: {application/json: {schema: {$ref: '#/components/schemas/EmergencyContactSuccess'}}}}
        '401': {description: Sesión ausente o caducada.}
        '403': {description: Rol distinto de STUDENT.}
        '404': {description: La cuenta no tiene una ficha de paciente vigente.}
    put:
      summary: Crear o reemplazar el contacto de emergencia propio (A-02)
      description: 'Solo rol STUDENT y siempre sobre su propia ficha; no acepta identificadores de paciente. Audita CONTACTO_EMERGENCIA_ACTUALIZADO sin nombre ni teléfono. Requiere CSRF.'
      security: [{sessionCookie: [], csrfSession: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/EmergencyContact'}}}
      responses:
        '200': {description: Contacto guardado, content: {application/json: {schema: {$ref: '#/components/schemas/EmergencyContactSuccess'}}}}
        '400': {description: Falta nombre o teléfono, parentesco desconocido o campos de más.}
        '403': {description: Rol distinto de STUDENT o CSRF ausente.}
        '404': {description: La cuenta no tiene una ficha de paciente vigente.}
  /api/me/notification-preferences:
    get:
      summary: Preferencias propias de recordatorios de bandeja
      description: Sin fila persistida devuelve true/true y updatedAt null, sin escribir. No incluye SMTP ni correo.
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Preferencias efectivas. Cache-Control no-store, private.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationPreferencesSuccess'}
        '401': {$ref: '#/components/responses/NotificationUnauthenticated'}
        '500': {$ref: '#/components/responses/NotificationFailure'}
    put:
      summary: Guardar ambas preferencias propias de recordatorios
      description: Dos booleanos estrictos, sin otros campos ni identidad destinataria. Escritura y auditoría atómicas; requiere CSRF.
      security: [{sessionCookie: [], csrfSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [receiveReminders, reinforcedReminder]
              properties:
                receiveReminders: {type: boolean}
                reinforcedReminder: {type: boolean}
      responses:
        '200':
          description: Preferencias guardadas. Cache-Control no-store, private.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationPreferencesSuccess'}
        '400': {$ref: '#/components/responses/NotificationInvalid'}
        '401': {$ref: '#/components/responses/NotificationUnauthenticated'}
        '403': {description: CSRF ausente o inválido; error legacy de texto}
        '500': {$ref: '#/components/responses/NotificationFailure'}
  /api/academic-periods:
    get:
      summary: Calendario académico (O-01, UC-29)
      description: Solo ADMINISTRATIVE. Períodos ordenados por startDate. Cache-Control no-store, private.
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Lista de períodos; vacía es válida.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: {type: boolean, const: true}
                  data: {type: array, items: {$ref: '#/components/schemas/AcademicPeriod'}}
        '401': {description: Sesión ausente o caducada}
        '403': {description: Rol distinto de ADMINISTRATIVE}
    post:
      summary: Registrar un período académico
      description: |
        Solo ADMINISTRATIVE; requiere CSRF. Fechas inclusivas, a lo sumo 367 días. Ningún día puede
        pertenecer a dos períodos, sea cual sea su tipo. Escritura y auditoría atómicas.
      security: [{sessionCookie: [], csrfSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, type, startDate, endDate]
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
                type: {$ref: '#/components/schemas/AcademicPeriodType'}
                startDate: {type: string, format: date}
                endDate: {type: string, format: date}
      responses:
        '201':
          description: Período registrado.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: {type: boolean, const: true}
                  data: {$ref: '#/components/schemas/AcademicPeriod'}
        '400': {description: Nombre, tipo o fechas inválidos, o campos no admitidos}
        '401': {description: Sesión ausente o caducada}
        '403': {description: Rol distinto de ADMINISTRATIVE o CSRF inválido}
        '409': {description: El período se superpone con otro ya registrado}
  /api/scheduling/initial-values:
    get:
      summary: Valores iniciales de la agenda por especialidad y tipo de período (DV-10)
      description: |
        Solo ADMINISTRATIVE. Una fila por tipo de período para el área (specialtyId null) y para cada
        especialidad activa o con valores guardados. Lo no guardado sale con isDefault true y los valores
        de DV-10: asistencia 0.800, peso 10 citas y expectedDailyDemand null, que significa demanda igual
        a la capacidad publicada.
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Tabla completa de valores iniciales. Cache-Control no-store, private.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InitialSchedulingValuesSuccess'}
        '401': {description: Sesión ausente o caducada}
        '403': {description: Rol distinto de ADMINISTRATIVE}
    put:
      summary: Guardar valores iniciales
      description: |
        Solo ADMINISTRATIVE; requiere CSRF. Guarda las filas enviadas, todo o nada; las no enviadas
        conservan su valor. Una fila igual a la guardada no se reescribe ni se audita; un cambio se audita
        con el valor anterior. Devuelve la tabla completa, como el GET.
      security: [{sessionCookie: [], csrfSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [values]
              properties:
                values:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: object
                    additionalProperties: false
                    required: [periodType, expectedAttendance, appointmentWeight]
                    properties:
                      specialtyId: {type: [string, 'null'], format: uuid, description: null o ausente es el área; la especialidad debe estar activa}
                      periodType: {$ref: '#/components/schemas/AcademicPeriodType'}
                      expectedDailyDemand: {type: [number, 'null'], minimum: 0, maximum: 1000, description: Hasta dos decimales; null o ausente es igual a la capacidad publicada}
                      expectedAttendance: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1, description: Proporción con hasta tres decimales}
                      appointmentWeight: {type: integer, minimum: 1, maximum: 100}
      responses:
        '200':
          description: Tabla completa tras guardar.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InitialSchedulingValuesSuccess'}
        '400': {description: Valores inválidos, fila repetida o especialidad no habilitada; no se guarda ninguna fila}
        '401': {description: Sesión ausente o caducada}
        '403': {description: Rol distinto de ADMINISTRATIVE o CSRF inválido}
  /api/scheduling/suggestions:
    get:
      summary: Sugerencias de agenda de una fecha (O-04, UC-30)
      description: |
        Solo ADMINISTRATIVE. La tarea nocturna las genera para los próximos 10 días hábiles:
        DAY_SLOTS (citas sugeridas por jornada), OVERBOOKING (subir la capacidad de cupos concretos,
        a lo sumo 10 % sobre la capacidad y con riesgo de saturación beta-binomial ≤ 20 %, RN-35) y
        CAPACITY_ALERT (demanda proyectada de 10 días hábiles sobre el 100 % o bajo el 50 % de los
        lugares libres publicados; lleva la fecha en que empieza su horizonte). Sugerir no cambia nada:
        se aplica al decidir (O-06). status sale de la decisión o de expiresAt. Cache-Control no-store, private.
      security: [{sessionCookie: []}]
      parameters:
        - {in: query, name: date, description: Fecha AAAA-MM-DD; por defecto hoy en Bolivia, schema: {type: string, format: date}}
      responses:
        '200':
          description: Sugerencias de la fecha, alertas primero; lista vacía es válida.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: {type: boolean, const: true}
                  data: {type: array, items: {$ref: '#/components/schemas/ScheduleSuggestion'}}
        '400': {description: Fecha con formato inválido}
        '401': {description: Sesión ausente o caducada}
        '403': {description: Rol distinto de ADMINISTRATIVE}
  /api/scheduling/suggestions/{id}/decision:
    post:
      summary: Decidir una sugerencia de agenda (O-06, RN-33, RF-41)
      description: |
        Solo ADMINISTRATIVE, con CSRF. Registra la decisión y aplica el cambio en una transacción; solo la decisión
        cambia la agenda (RN-33). OVERBOOKING aceptado sube la capacidad de los cupos sugeridos; MODIFIED indica la
        capacidad final de cupos de la misma jornada, con el tope de RN-35 sobre la capacidad vigente, cada cupo ≤ 20
        y sin cambiar la duración. Si la capacidad de la jornada cambió desde la sugerencia responde 409.
        DAY_SLOTS y CAPACITY_ALERT solo admiten ACCEPTED o REJECTED y no cambian la agenda. El motivo es
        obligatorio para MODIFIED y REJECTED. EXPIRED lo marca el sistema cuando vence sin decisión (PA-21).
        RESCHEDULE (O-07): ACCEPTED mueve la cita al cupo sugerido, MODIFIED al único slots[0].slotId y REJECTED la
        deja; mover la cita genera CITA_REPROGRAMADA en la bandeja del estudiante y, si ya no quedan citas en el
        horario, registra el bloqueo propuesto. REQUEST_SLOT no se decide (409). Audita SUGERENCIA_AGENDA_DECIDIDA
        sin el motivo.
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: {type: string, enum: [ACCEPTED, MODIFIED, REJECTED]}
                reason: {type: [string, 'null'], maxLength: 500}
                slots:
                  type: array
                  minItems: 1
                  maxItems: 20
                  description: Solo con MODIFIED. OVERBOOKING lleva capacity en cada cupo; RESCHEDULE, un solo slotId sin capacity
                  items:
                    type: object
                    additionalProperties: false
                    required: [slotId]
                    properties:
                      slotId: {type: string, format: uuid}
                      capacity: {type: integer, maximum: 20, description: Solo OVERBOOKING; capacidad final, mayor que la actual}
      responses:
        '200':
          description: La sugerencia con su decisión
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: {type: boolean, const: true}
                  data: {$ref: '#/components/schemas/ScheduleSuggestion'}
        '400': {description: Cuerpo inválido, falta el motivo, decisión no admitida para el tipo o sobrecupo sobre el 10 % (RN-35)}
        '401': {description: Sesión ausente o caducada}
        '403': {description: Rol distinto de ADMINISTRATIVE o CSRF inválido}
        '404': {description: La sugerencia no existe}
        '409': {description: Ya decidida, vencida, tipo aún no decidible o jornada cambiada desde la sugerencia}
  /api/scheduling/block-proposals:
    post:
      summary: Proponer el bloqueo de una jornada con reprogramación de citas (O-07, UC-31)
      description: |
        Solo ADMINISTRATIVE, con CSRF. Si el horario no tiene citas, el bloqueo se registra de inmediato (APPLIED).
        Si tiene citas programadas, crea una sugerencia RESCHEDULE por cita con el cupo compatible libre más cercano
        en el tiempo (misma especialidad o área, sin repetir lugares ni chocar con otra cita del paciente; slotId
        null si no hay). Las reprogramaciones se deciden con POST /api/scheduling/suggestions/{id}/decision:
        ACCEPTED mueve la cita al cupo sugerido, MODIFIED a slots[0].slotId y REJECTED la deja. El cambio de cupo
        genera CITA_REPROGRAMADA (APPOINTMENT_RESCHEDULED) en la bandeja del estudiante. Cuando ya no quedan citas
        en el horario, el bloqueo se registra. El bloqueo propio del médico (V7) sigue rechazando horarios con citas.
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [staffId, date, label]
              properties:
                staffId: {type: string, format: uuid}
                date: {type: string, format: date}
                startTime: {type: [string, 'null'], pattern: '^\\d{2}:\\d{2}$', description: Junto con endTime; sin ambos es el día completo}
                endTime: {type: [string, 'null'], pattern: '^\\d{2}:\\d{2}$'}
                label: {type: string, maxLength: 120}
      responses:
        '201':
          description: Propuesta creada
          content:
            application/json:
              schema: {type: object, required: [ok, data], properties: {ok: {type: boolean, const: true}, data: {$ref: '#/components/schemas/BlockProposal'}}}
        '400': {description: Cuerpo, fecha u horario inválido}
        '403': {description: Rol distinto de ADMINISTRATIVE o CSRF inválido}
        '404': {description: Médico inexistente o inactivo}
        '409': {description: Propuesta pendiente que se superpone, o cita ya iniciada o con paciente presente}
  /api/scheduling/block-proposals/{id}:
    get:
      summary: Consultar una propuesta de bloqueo y sus reprogramaciones
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Propuesta
          content:
            application/json:
              schema: {type: object, required: [ok, data], properties: {ok: {type: boolean, const: true}, data: {$ref: '#/components/schemas/BlockProposal'}}}
        '403': {description: Rol distinto de ADMINISTRATIVE}
        '404': {description: La propuesta no existe}
  /api/scheduling/block-proposals/{id}/apply:
    post:
      summary: Registrar el bloqueo cuando ya no quedan citas en el horario
      description: Para cuando se rechazó mover una cita y luego se canceló por el flujo normal. Idempotente si ya se aplicó.
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Propuesta aplicada
          content:
            application/json:
              schema: {type: object, required: [ok, data], properties: {ok: {type: boolean, const: true}, data: {$ref: '#/components/schemas/BlockProposal'}}}
        '403': {description: Rol distinto de ADMINISTRATIVE o CSRF inválido}
        '404': {description: La propuesta no existe}
        '409': {description: Todavía hay citas en el horario}
  /api/scheduling/metrics:
    get:
      summary: Indicadores del componente de optimización (O-08, RF-41, cuadro 3.70)
      description: |
        Solo ADMINISTRATIVE. Período [from, to] en fechas de Bolivia, de hasta 366 días; por defecto, los 30 días que
        terminan ayer. Un indicador sin datos es null.
        - idlePlaces: lugares publicados sin paciente atendido sobre lugares publicados, en jornadas cerradas.
        - waitTime: días entre el ingreso de la solicitud y la cita, para solicitudes asignadas en el período.
        - overload: jornadas en que llegaron más pacientes que la capacidad definida por el médico (sin el sobrecupo
          aplicado por Administración); maxRisk es el riesgo máximo configurado del sobrecupo.
        - attendanceCalibration: puntuación de Brier por cita, pronosticando cada día solo con los días anteriores;
          la línea base es una asistencia constante igual al valor inicial y skill = 1 − brier / línea base.
        - demandError: error absoluto medio de la demanda diaria por especialidad; la línea base repite las
          solicitudes del mismo día de la semana anterior y se compara solo en los días que la tienen.
        - suggestions: emitidas en el período por estado; acceptanceRate = (aceptadas + modificadas) / emitidas.
        - notifications: avisos de bandeja registrados, entregados y leídos.
      security: [{sessionCookie: []}]
      parameters:
        - {in: query, name: from, required: false, schema: {type: string, format: date}}
        - {in: query, name: to, required: false, schema: {type: string, format: date}}
      responses:
        '200':
          description: Indicadores
          headers:
            Cache-Control: {schema: {type: string, const: 'no-store, private'}}
          content:
            application/json:
              schema: {type: object, required: [ok, data], properties: {ok: {type: boolean, const: true}, data: {$ref: '#/components/schemas/SchedulingMetrics'}}}
        '400': {description: Fechas inválidas, from posterior a to o más de 366 días}
        '401': {description: Sin sesión}
        '403': {description: Rol distinto de ADMINISTRATIVE}
  /api/reports/administrative-summary:
    get:
      summary: Panorama administrativo sin contenido clínico
      description: Solo ADMINISTRATIVE. Cuenta pacientes sin archivar, citas SCHEDULED/CHECKED_IN y cupos PUBLISHED disponibles globales, derivaciones PENDING_ASSIGNMENT y cierres de hoy Bolivia. No devuelve textos clínicos ni identidades. Lectura auditada, no-store/private.
      responses:
        '200':
          description: ok/data con day, registeredPatients, scheduledAppointments, closedToday, pendingReferrals, availableSlots; números cero válidos
        '401': {description: Sesión ausente/caducada}
        '403': {description: Rol no permitido}
        '500': {description: Error recuperable; no presenta métricas cero como sustituto}
  /api/reports/clinical:
    get:
      operationId: queryClinicalReport
      summary: Reporte clínico autorizado por período y criterios combinados
      description: |
        Conserva ok/data/filters. ADMINISTRATIVE y REPORTING_OFFICER consultan
        el conjunto institucional; médicos solo atenciones propias cerradas, con
        especialidad vigente para SPECIALIST. Fechas inclusivas de Bolivia.
        Sin fecha: últimos 30 días hasta hoy. Texto parcial normalizado sin
        acentos, con espacios compactados; porcentajes/guiones bajos son literales.
        Todas las listas se combinan por AND. Los antecedentes son los vinculados;
        el fallback de revisión se limita al mismo encuentro/origen remitido autorizado.
        Orden closed_at DESC, encounter_id ASC en empates. null se conserva.
        Habits y specialty_history usan JSON clínico en español.
        La respuesta agrega presentation solo al indicar columns o groupBy.
        Columns ordena la presentación; data conserva las 17 claves de referencia.
        Groups contiene key (null para especialidad ausente), count y encounterIds
        en el orden del detalle. Orden de grupos por primera aparición; ningún
        agregado incluye filas excluidas por autorización o filtros.
        Se audita actor, cantidad de filas y nombres de columnas/dimensiones,
        sin términos de búsqueda, diagnósticos ni contenido clínico.
      parameters:
        - {in: query, name: from, schema: {type: string, format: date}}
        - {in: query, name: to, schema: {type: string, format: date}}
        - {in: query, name: specialtyId, schema: {type: string, format: uuid}}
        - {in: query, name: encounterType, schema: {type: string, enum: [INITIAL, SPECIALTY]}}
        - {in: query, name: sex, description: 'A-01: deja fuera a los pacientes sin sexo registrado', schema: {type: string, enum: [FEMALE, MALE, NOT_RECORDED]}}
        - {in: query, name: diagnosis, schema: {type: string, maxLength: 200}}
        - {in: query, name: search, schema: {type: string, maxLength: 200}}
        - {in: query, name: allergies, description: Array JSON de hasta 15 textos (200 caracteres); todos deben coincidir, schema: {type: string}}
        - {in: query, name: histories, description: Array JSON de hasta 15 textos; todos deben coincidir, schema: {type: string}}
        - {in: query, name: habitTerms, description: Array JSON de hasta 15 textos contra hábitos en español, schema: {type: string}}
        - {in: query, name: positiveHabits, description: 'Array JSON con tobacco/alcohol/physicalActivity; todos deben ser SI', schema: {type: string}}
        - in: query
          name: columns
          description: 'Array JSON ordenado, no vacío y sin duplicados: closed_at, patient_name, carnet, encounter_type, specialty_name, diagnoses, allergies, background_summary, habits, chief_complaint, assessment, instructions, follow_up_text, birth_date, specialty_history, sex (FEMALE, MALE, NOT_RECORDED o null si nunca se registró).'
          schema: {type: string}
        - in: query
          name: groupBy
          description: 'Array JSON de cero a dos dimensiones distintas: day, month, encounterType, specialty, sex. day y month no se combinan.'
          schema: {type: string}
      responses:
        '200':
          description: Reporte completo; sin coincidencias data [] y groups []. Cache-Control no-store/private.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data, filters]
                properties:
                  ok: {const: true}
                  filters: {type: object, description: 'Todos los filtros canónicos; escalares ausentes null y listas ausentes []'}
                  data:
                    type: array
                    items:
                      type: object
                      required: [encounter_id, closed_at, encounter_type, specialty_name, patient_id, carnet, patient_name, birth_date, chief_complaint, assessment, instructions, follow_up_text, diagnoses, allergies, background_summary, habits, specialty_history]
                  presentation:
                    type: object
                    required: [columns, groupBy, groups]
                    properties:
                      columns: {type: array, items: {type: string}}
                      groupBy: {type: array, items: {type: string}}
                      groups:
                        type: array
                        items:
                          type: object
                          required: [key, count, encounterIds]
                          properties:
                            key: {type: array, items: {type: [string, 'null']}}
                            count: {type: integer, minimum: 1}
                            encounterIds: {type: array, items: {type: string, format: uuid}}
        '400': {description: Fechas/tipo/listas/columnas/agrupación inválidos; error texto sin clínica}
        '401': {description: Sesión ausente/caducada; error texto}
        '403': {description: Rol o personal no autorizado; error texto}
        '500': {description: Fallo recuperable; no se responde como lista vacía exitosa}
    post:
      summary: Registro compatible de descarga clínica existente
      description: Preserva 201/data.id persistido como evento de auditoría. Formato CSV/XLSX/PDF y rowCount entero 0..10000. No genera archivos ni acredita una exportación completada; el archivo usa el endpoint separado POST /api/reports/clinical/export.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format, rowCount]
              properties:
                format: {type: string, enum: [CSV, XLSX, PDF]}
                rowCount: {type: integer, minimum: 0, maximum: 10000}
                purpose: {type: string, maxLength: 300, default: Gestión clínica}
                filters: {type: object}
      responses:
        '201': {description: ok true y data.id UUID de auditoría persistida}
        '400': {description: Exportación inválida; error texto}
        '401': {description: Sesión ausente/caducada}
        '403': {description: Rol no permitido o CSRF inválido}
  /api/reports/clinical/export:
    post:
      operationId: exportAuthorizedClinicalReport
      summary: Generar CSV, XLSX o PDF del conjunto recalculado y autorizado
      description: |
        ADMINISTRATIVE/REPORTING_OFFICER: ámbito institucional; médicos: ámbito
        propio y área vigente de GET /api/reports/clinical. Requiere sesión y CSRF.
        No recibe filas ni cantidades del navegador: rechaza rows/rowCount y campos
        desconocidos. Recalcula con la misma función/orden/filtros del reporte.
        Acepta 0..10000 atenciones; si supera el límite, rechaza sin truncar ni publicar.
        Columnas y groupBy usan las listas permitidas de GET. Los grupos se presentan
        como columna Grupo con etiqueta/cantidad, y las filas siguen el orden de cada
        grupo de la pantalla. Los tres formatos contienen la misma tabla y metadatos.
        CSV UTF-8 BOM/CRLF entre registros, campos entre comillas y neutralización
        de fórmulas con apóstrofo inicial. XLSX usa celdas STRING, emblemas, filtros,
        encabezado fijo y pie confidencial. PDF A3 apaisado con emblemas/fuente Unicode,
        tablas y encabezados repetidos; no recorta texto, continúa en otras páginas.
        Celdas de más de 30000 caracteres se continúan en filas con columna Parte en
        los tres formatos, sin truncar. Esas filas físicas no aumentan rowCount.
        Genera bytes completos antes de registrar COMPLETED/checksum y devolverlos.
        Fallo de generación autorizado registra FAILED sin archivo; fallo de auditoría
        revierte la publicación. No hay archivo público ni URL persistente.
        Cada envío explícito produce una exportación independiente; no hay reintento
        automático tras respuesta perdida. La auditoría indica actor/finalidad/formato/
        estado/cantidad y nombres de filtros; valores completos quedan en procedencia
        privada, consultable solo por el solicitante con rol vigente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [format, purpose, filters]
              properties:
                format: {type: string, enum: [CSV, XLSX, PDF]}
                purpose: {type: string, minLength: 1, maxLength: 300}
                filters:
                  type: object
                  description: Los filtros canónicos del GET, con listas JSON reales. Admite null para filtros ausentes.
                columns: {type: array, minItems: 1, maxItems: 16, items: {type: string}, description: Columnas permitidas del GET en orden; omisión incluye las dieciséis}
                groupBy: {type: array, maxItems: 2, items: {type: string}, description: Mismas dimensiones y restricciones del GET}
      responses:
        '200':
          description: Archivo completo con cantidad real y procedencia privada; Cache-Control no-store/private y nosniff.
          headers:
            Content-Disposition: {schema: {type: string}, description: attachment; filename=reporte-clinico-UUID.ext}
            X-Export-Id: {schema: {type: string, format: uuid}}
            X-Export-Row-Count: {schema: {type: integer, minimum: 0, maximum: 10000}}
            X-Content-SHA256: {schema: {type: string, pattern: '^[0-9a-f]{64}$'}}
            Content-Length: {schema: {type: integer, minimum: 1}}
          content:
            text/csv: {schema: {type: string, format: binary}}
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {schema: {type: string, format: binary}}
            application/pdf: {schema: {type: string, format: binary}}
        '400': {description: Finalidad/formato/filtros/presentación inválidos o más de 10000 atenciones; error texto}
        '401': {description: Sesión ausente/caducada; error texto}
        '403': {description: Rol/área/personal o CSRF no permitidos; error texto}
        '500': {description: Generación/auditoría fallida; error texto y ningún attachment parcial}
  /api/reports/clinical/exports/{id}:
    get:
      operationId: getPrivateClinicalExportReceipt
      summary: Consultar procedencia propia de una exportación
      description: Solo solicitante con rol exportador vigente; sin archivo ni filas clínicas. Otro actor/inexistente devuelve el mismo 404. Lectura auditada; no-store/private.
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: ok/data con procedencia privada, filtros canónicos, formato, finalidad, estado y checksum del archivo completado
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: {const: true}
                  data:
                    type: object
                    required: [id, requestedBy, createdAt, purpose, filters, columns, groupBy, format, state, rowCount, sha256]
                    properties:
                      id: {type: string, format: uuid}
                      requestedBy: {type: string, format: uuid}
                      createdAt: {type: string, format: date-time}
                      purpose: {type: string}
                      filters: {type: object}
                      columns: {type: array, items: {type: string}}
                      groupBy: {type: array, items: {type: string}}
                      format: {type: string, enum: [CSV, XLSX, PDF]}
                      state: {type: string, enum: [COMPLETED, FAILED]}
                      rowCount: {type: integer, minimum: 0, maximum: 10000}
                      sha256: {type: [string, 'null']}
        '401': {description: Sesión ausente/caducada}
        '403': {description: Rol no permitido}
        '404': {description: Exportación ajena o inexistente; error texto sin exponer filtros}
  /api/medical/encounters/{id}/export.docx:
    get:
      operationId: exportAuthorizedClinicalWord
      summary: Exportar una ficha cerrada autorizada con sus adendas
      description: |
        REVIEW_DOCTOR o SPECIALIST con relación clínica y ámbito FE-17 vigente.
        Una ficha individual con su versión, plantilla histórica, antecedentes vinculados,
        diagnósticos, mediciones y metadatos de documentos. Las adendas se incluyen
        por número en sección separada con motivo, contenido, actor y fecha Bolivia.
        No incluye el antecedente global posterior ni otras atenciones/áreas.
        Genera todo el DOCX antes de responder y audita FICHA_WORD_EXPORTADA con
        actor, finalidad, formato, versión y cantidad de adendas sin contenido clínico.
        Repetir GET genera otra exportación auditada; no modifica la ficha.
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
        - in: query
          name: purpose
          required: false
          description: Finalidad auditada; por omisión Consulta clínica autorizada. Espacios se recortan.
          schema: {type: string, minLength: 1, maxLength: 500}
      responses:
        '200':
          description: DOCX completo, emblemas institucionales y pie confidencial. Comparar contenido, no bytes ZIP.
          headers:
            Content-Disposition: {schema: {type: string}, description: attachment; filename=ficha-clinica-UUID.docx}
            Cache-Control: {schema: {const: 'no-store, private'}}
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: {type: string, format: binary}
        '400': {description: Finalidad inválida; ok false y error texto}
        '401': {description: Sesión ausente o caducada; error texto}
        '403': {description: Rol no permitido; error texto}
        '404': {description: Ficha inexistente, no cerrada o fuera del ámbito; mismo error sin exponer clínica}
        '500': {description: Error recuperable de generación/auditoría; no publica archivo parcial}
  /api/administrative/referrals:
    get:
      summary: Bandeja e historial administrativo de derivaciones
      description: Solo ADMINISTRATIVE. Conserva los campos RPC y null. Todos los estados; PENDING_ASSIGNMENT, ASSIGNED, IN_PROGRESS y resto, luego requested_at DESC/id DESC. El contenido clínico se consulta sin edición y el acceso se audita.
      responses:
        '200':
          description: ok/data lista, vacía []
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {const: true}
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, patient_id, patient_name, patient_carnet, specialty_id, specialty_name, priority, reason, comment_for_specialist, status, requested_at, requested_by_name, assigned_staff_name, appointment_id, scheduled_for]
                      properties:
                        id: {type: string, format: uuid}
                        patient_id: {type: string, format: uuid}
                        patient_name: {type: string}
                        patient_carnet: {type: string}
                        specialty_id: {type: string, format: uuid}
                        specialty_name: {type: string}
                        priority: {type: string, enum: [ROUTINE, PRIORITY, URGENT]}
                        reason: {type: string}
                        comment_for_specialist: {type: string}
                        status: {type: string, enum: [PENDING_ASSIGNMENT, ASSIGNED, IN_PROGRESS, CLOSED, RETURNED, CANCELLED]}
                        requested_at: {type: string, format: date-time}
                        requested_by_name: {type: string}
                        assigned_staff_name: {type: [string, 'null']}
                        appointment_id: {type: [string, 'null'], format: uuid}
                        scheduled_for: {type: [string, 'null'], format: date-time}
        '401': {description: Sesión requerida}
        '403': {description: Rol sin permiso}
  /api/patients/{patientId}/referrals:
    get:
      summary: Derivaciones disponibles para seleccionar en programación
      description: Solo ADMINISTRATIVE. Lista PENDING_ASSIGNMENT/ASSIGNED del paciente, requested_at DESC/id DESC. ASSIGNED se conserva para consulta; crear otra solicitud o asignar de nuevo se rechaza. Lectura auditada.
      parameters:
        - {name: patientId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: ok/data con id, specialty_id, specialty_name, status; lista vacía []
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {const: true}
                  data: {type: array, items: {type: object, required: [id, specialty_id, specialty_name, status]}}
        '401': {description: Sesión requerida}
        '403': {description: Rol sin permiso}
  /api/appointment-requests:
    get:
      summary: Consultar solicitudes y citas autorizadas
      description: STUDENT propio o ADMINISTRATIVE. Conserva id/appointment_type/referral_id/specialty_id/status/requested_at/cancelled_at/cancellation_reason/patient/appointment; fechas y relaciones ausentes null.
      responses:
        '200': {description: 'ok/data lista de solicitudes con cita, o []'}
        '401': {description: Sesión requerida}
        '403': {description: Rol sin permiso}
    post:
      summary: Crear solicitud de revisión, especialidad directa o derivación
      description: Para REFERRAL exige ADMINISTRATIVE, patientId y referralId; specialtyId debe ser null/ausente porque la especialidad procede de la derivación. Valida pertenencia al paciente, paciente no archivado, estado PENDING_ASSIGNMENT y una sola solicitud pendiente concurrente. No modifica el contenido de la derivación.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                appointmentType: {type: string, enum: [INITIAL, SPECIALTY, REFERRAL], default: INITIAL}
                patientId: {type: [string, 'null'], format: uuid}
                referralId: {type: [string, 'null'], format: uuid}
                specialtyId: {type: [string, 'null'], format: uuid}
                consents: {$ref: '#/components/schemas/ConsentAnswer'}
      responses:
        '201': {description: 'Contrato heredado: {ok:true,data:{id:uuid}}'}
        '400': {description: Parámetros ausentes o inválidos, o consents incompleto (sin aceptar términos o sin elegir Sí/No)}
        '401': {description: Sesión requerida}
        '403': {description: Rol o CSRF sin permiso}
        '404': {description: Paciente no disponible para solicitar derivación}
        '409': {description: 'REFERRAL no programable, otro paciente o solicitud pendiente duplicada; sin cambios parciales. También si consents trae versiones que ya no son las vigentes.'}
        '422':
          description: 'A-03: el paciente tiene la respuesta de consentimiento pendiente y no se envió consents. Solo con salud-u.consents.required=true (paso 3 de la puesta en marcha).'
          content: {application/json: {schema: {$ref: '#/components/schemas/ConsentPendingError'}}}
  /api/appointment-requests/{requestId}/assign:
    post:
      summary: Asignar solicitud pendiente a un cupo compatible
      description: Solo ADMINISTRATIVE. Para REFERRAL actualiza solicitud, cita SPECIALTY, cupo, estado/profesional de derivación y eventos/auditoría en una transacción. Exige derivación PENDING_ASSIGNMENT del mismo paciente y especialidad compatible. Contenido y encuentro de origen intactos; doble asignación rechazada.
      parameters:
        - {name: requestId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [slotId], properties: {slotId: {type: string, format: uuid}}}
      responses:
        '200': {description: 'Contrato heredado: {ok:true,data:{appointmentId:uuid}}'}
        '400': {description: Cuerpo inválido o cupo incompatible}
        '401': {description: Sesión requerida}
        '403': {description: Rol o CSRF sin permiso}
        '409': {description: Cupo lleno, solicitud no pendiente, derivación no programable o paciente con cita incompatible; rollback completo}
  /api/appointment-requests/{requestId}/suggested-slots:
    get:
      summary: Cupos sugeridos para una solicitud (O-05, UC-07 extendido, RF-40)
      description: |
        Solo ADMINISTRATIVE y solo consulta: no cambia la agenda; se asigna con POST .../assign.
        Considera los cupos que la asignación aceptaría (publicados, futuros, con lugar, de la especialidad de la
        solicitud o del área si es INITIAL, sin choque con otra cita activa del paciente) y devuelve los tres mejores.
        Puntaje = 100·(1 − (w·espera + (1 − w)·ocupación)), con espera = días/30 (tope 1) y ocupación = asistentes
        esperados de la jornada con esta cita / su capacidad (tope 1). w es 0,9 si la derivación es URGENT,
        0,7 si es PRIORITY y 0,5 si es ROUTINE o no hay derivación. Cache-Control no-store, private.
      security: [{sessionCookie: []}]
      parameters:
        - {name: requestId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Hasta tres cupos ordenados; slots vacío es válido.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: {type: boolean, const: true}
                  data: {$ref: '#/components/schemas/SuggestedSlots'}
        '401': {description: Sesión requerida}
        '403': {description: Rol distinto de ADMINISTRATIVE}
        '404': {description: La solicitud no existe}
        '409': {description: Solicitud no pendiente o derivación no programable}
  /api/medical/referrals:
    get:
      summary: Consultar derivaciones emitidas por el médico de revisión
      description: Rol REVIEW_DOCTOR y personal activo. Solo emisor y atención INITIAL propia cerrada. ok/data lista, vacía [] y orden createdAt DESC/id DESC; no requiere consultar historia longitudinal. Registra acceso sin texto clínico.
      responses:
        '200':
          description: Lista de derivaciones emitidas
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: {const: true}
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, patient, specialty, priority, status, reason, comment, createdAt, sourceAppointmentId, sourceEncounterId, diagnosisCount, documentCount]
                      properties:
                        id: {type: string, format: uuid}
                        patient: {type: object, description: 'id/fullName/carnet del paciente autorizado'}
                        specialty: {type: object, description: 'id/name de la especialidad, conservados aunque se desactive'}
                        priority: {type: string, enum: [ROUTINE, PRIORITY, URGENT]}
                        status: {type: string, enum: [PENDING_ASSIGNMENT, ASSIGNED, IN_PROGRESS, RETURNED, CLOSED, CANCELLED]}
                        reason: {type: string}
                        comment: {type: string}
                        createdAt: {type: string, format: date-time}
                        sourceAppointmentId: {type: string, format: uuid}
                        sourceEncounterId: {type: string, format: uuid}
                        diagnosisCount: {type: integer}
                        documentCount: {type: integer}
        '401': {description: Sesión requerida}
        '403': {description: Rol sin permiso}
        '404': {description: Personal no disponible}
  /api/medical/referrals/{id}:
    get:
      summary: Consultar contexto y elementos compartidos de una derivación propia emitida
      description: Solo emisor de revisión y origen propio cerrado. Los diagnósticos y documentos pertenecen al mismo paciente; documentos AVAILABLE. Conserva null y listas vacías. Sin edición del contenido clínico y con auditoría de consulta.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: ok/data con identidad, prioridad, contexto de origen y elementos compartidos
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: {const: true}
                  data:
                    type: object
                    required: [id, patient, specialty, priority, status, reason, comment, createdAt, source, diagnoses, documents]
                    properties:
                      id: {type: string, format: uuid}
                      patient: {type: object, description: 'id/fullName/carnet'}
                      specialty: {type: object, description: 'id/name'}
                      priority: {type: string, enum: [ROUTINE, PRIORITY, URGENT]}
                      status: {type: string}
                      reason: {type: string}
                      comment: {type: string}
                      createdAt: {type: string, format: date-time}
                      source: {type: object, description: 'id/appointmentId/status=CLOSED, chiefComplaint/assessment/instructions/followUpText/reviewHistoryVersion. Campos históricos ausentes conservan null.'}
                      diagnoses: {type: array, items: {type: object}, description: 'id/label/isPrimary; orden de creación/id ascendente'}
                      documents: {type: array, items: {type: object}, description: 'id/documentType/filename/mimeType/sizeBytes/studyDate/description; opcionales null y orden de carga/id ascendente'}
        '401': {description: Sesión requerida}
        '403': {description: Rol sin permiso}
        '404': {description: Derivación ajena o inexistente; sin contenido clínico}
    patch:
      summary: Resolver o devolver una derivación asignada propia
      description: 'SPECIALIST con personal activo y especialidad/afiliación vigentes. ASSIGNED o IN_PROGRESS. RESOLVE exige encuentro SPECIALTY propio CLOSED; RETURN exige motivo. Conserva el origen clínico y no cancela la cita ni reescribe la ficha. Estado/evento/motivo/seguimiento/actor/fecha/auditoría atómicos. Repetición o transición inválida 403 sin duplicar.'
      security: [{sessionCookie: [], csrfSession: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [RESOLVE, RETURN]}
                reason: {type: [string, 'null'], maxLength: 2000, description: Obligatorio y no vacío para RETURN.}
                followUpText: {type: [string, 'null'], maxLength: 4000, description: Opcional; espacios o vacío se guardan null.}
      responses:
        '200':
          description: 'Contrato BE-16 exacto: ok/data(referralId,status=CLOSED o RETURNED).'
          content: {application/json: {schema: {type: object, required: [ok, data], properties: {ok: {const: true}, data: {type: object, required: [referralId, status], properties: {referralId: {type: string, format: uuid}, status: {enum: [CLOSED, RETURNED]}}}}}}}
        '400': {description: Acción/motivo/seguimiento inválidos; error texto.}
        '401': {description: Sesión ausente o caducada.}
        '403': {description: Rol/relación/especialidad o transición no permitidos; incluye repetición.}
        '409': {description: RESOLVE requiere una atención especializada cerrada propia.}
  /api/medical/assigned-referrals:
    get:
      summary: Consultar derivaciones recibidas por el especialista actual
      description: 'Solo SPECIALIST con personal activo. Devuelve todos los estados asignados propios, orden createdAt/id descendente, listas vacías [] y opcionales null. Audita la lectura sin texto clínico.'
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: ok/data con lista de derivaciones asignadas propias.
          content: {application/json: {schema: {type: object, properties: {ok: {const: true}, data: {type: array, items: {$ref: '#/components/schemas/AssignedReferral'}}}}}}
        '401': {description: Sesión requerida.}
        '403': {description: Rol sin permiso.}
  /api/medical/assigned-referrals/{id}:
    get:
      summary: Consultar estado persistido y seguimiento de una derivación asignada propia
      security: [{sessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Contrato explícito de detalle para gestión y recuperación de respuesta perdida.
          content: {application/json: {schema: {type: object, properties: {ok: {const: true}, data: {$ref: '#/components/schemas/AssignedReferral'}}}}}
        '401': {description: Sesión requerida.}
        '403': {description: Rol sin permiso.}
        '404': {description: Ajena/inexistente sin exposición clínica.}
  /api/medical/documents:
    get:
      summary: Listar documentos disponibles de una atención propia
      description: Solo médico asignado activo. Orden cargado_en descendente e id descendente; vacío devuelve data []. No contiene rutas de almacenamiento ni tokens. Registra consulta autorizada.
      parameters:
        - {name: encounterId, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: ok/data con lista de metadatos; Cache-Control no-store private.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {const: true}
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, documentType, filename, mimeType, sizeBytes, studyDate, description, uploadedAt]
                      properties:
                        id: {type: string, format: uuid}
                        documentType: {type: string}
                        filename: {type: string}
                        mimeType: {type: string}
                        sizeBytes: {type: integer}
                        studyDate: {type: [string, 'null'], format: date}
                        description: {type: [string, 'null']}
                        uploadedAt: {type: string, format: date-time}
        '401': {description: Sesión requerida}
        '403': {description: Rol sin permiso}
        '404': {description: Atención ajena o inexistente; sin contenido clínico}
    post:
      summary: Adjuntar documento privado a una atención propia en borrador
      description: Requiere cookie Spring y CSRF. PDF/JPG/PNG/WEBP no vacío hasta 15 MiB. Comprueba firma MIME, tamaño real y SHA-256. Carga y cierre se serializan; el fallo no publica un archivo parcial.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, patientId, encounterId, documentType]
              properties:
                file: {type: string, format: binary}
                patientId: {type: string, format: uuid}
                encounterId: {type: string, format: uuid}
                documentType: {type: string, enum: [BLOOD_CHEMISTRY, LAB_RESULT, RADIOGRAPH, PRESCRIPTION, CLINICAL_PHOTO, REFERRAL_DOCUMENT, OTHER]}
                description: {type: string, maxLength: 1000}
                studyDate: {type: string, format: date}
      responses:
        '201': {description: 'Contrato heredado: {ok:true,data:{id:uuid}}'}
        '400': {description: Archivo vacío, contenido/MIME/tamaño/fecha inválidos}
        '401': {description: Sesión requerida}
        '403': {description: Rol, CSRF, paciente ajeno o encuentro cerrado sin permiso}
        '413': {description: Límite multipart superado}
  /api/medical/documents/{id}/download:
    get:
      summary: Obtener enlace privado para un documento autorizado
      description: data.url relativa de mismo origen, de un uso, ligada al actor/documento y válida durante 60 segundos. No se almacena en caché. Solicitar otra URL para cada acceso o reintento.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 'Contrato heredado: {ok:true,data:{url:string}}'}
        '401': {description: Sesión requerida}
        '403': {description: Rol sin permiso}
        '404': {description: Documento ajeno o no disponible}
  /api/medical/documents/{id}/content:
    get:
      summary: Descargar contenido privado completo
      description: Revalida la relación clínica vigente y consume el token. Respuesta binaria con tipo MIME y nombre original; no-store private y nosniff. Registra descarga sin texto clínico. El frontend usa Blob en memoria para previsualización y descarga.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: token, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: Archivo privado íntegro}
        '401': {description: Sesión requerida}
        '403': {description: Rol sin permiso}
        '404': {description: Enlace expirado, consumido, ajeno o archivo no disponible}
  /api/medical/encounters/{encounterId}:
    get:
      summary: Contexto del encuentro propio para editar o consultar su ficha
      description: Lectura nueva y acotada al médico asignado. Incluye paciente, cita, encuentro, antecedentes current/encounter, diagnósticos, mediciones y metadatos de documentos disponibles, sin consultar toda la historia longitudinal.
      operationId: getOwnEncounterContext
      security: [{sessionCookie: []}]
      parameters:
        - name: encounterId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Contexto autorizado; listas vacías y campos null conservados. Lectura auditada sin texto clínico en detalles.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: {type: boolean, const: true}
                  data:
                    type: object
                    required: [encounter, patient, appointment, clinicalBackground, diagnoses, measurements, documents]
                    properties:
                      encounter: {type: object, description: 'id/status/type, chiefComplaint, assessment, instructions, followUpText, bloodChemistryStatus, reviewHistory/reviewHistoryVersion y specialtyHistory/specialtyHistoryVersion/specialtyHistoryId; fichas null antes del cierre. JSON clínico en español.'}
                      specialty: {type: [object, 'null'], description: 'id/code/name para SPECIALTY; null para revisión.'}
                      template: {type: [object, 'null'], description: 'id/version/schema. Plantilla activa en DRAFT o plantilla histórica exacta en CLOSED. null si no existe.'}
                      patient: {type: object}
                      appointment: {type: object}
                      clinicalBackground: {type: object}
                      diagnoses: {type: array, items: {type: object}}
                      measurements: {type: array, items: {type: object}}
                      documents: {type: array, items: {type: object}}
                      referral: {type: [object, 'null'], description: Derivación emitida con contexto y elementos compartidos; null si no se emitió.}
        '401': {description: Sesión ausente o caducada.}
        '403': {description: Actor sin rol clínico.}
        '404': {description: Encuentro ajeno/inexistente, sin exposición clínica.}
  /api/medical/encounters/{encounterId}/finalize:
    post:
      summary: Persiste y cierra la ficha del encuentro propio de forma atómica
      description: Conserva el contrato de cierre caracterizado. No guarda borradores; la ficha de revisión se normaliza en Spring (incluidos null y número vacío como cero del handler heredado). La versión aumenta por paciente; mediciones incluyen talla en cm e IMC. Atención cerrada inmutable y doble cierre rechazado.
      operationId: finalizeOwnEncounter
      security: [{sessionCookie: [], csrfSession: []}]
      parameters:
        - name: encounterId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chiefComplaint, assessment]
              properties:
                chiefComplaint: {type: string, minLength: 1, maxLength: 4000}
                assessment: {type: string, minLength: 1, maxLength: 8000}
                reviewHistory: {type: object, description: 'JSON clínico canónico en español: versionEsquema=1, sexo, antecedentesPersonales, habitos, signosVitales, examenFisico, laboratorio, conducta y observaciones. Opciones SI/NO, ADECUADA/REGULAR/INADECUADA. Si se omite se aplican valores predeterminados. Claves heredadas aceptadas como entrada; salida siempre en español. No mezclar alias.'}
                specialtyHistory: {type: object, description: 'Obligatorio para especialista: versionEsquema=1, codigoEspecialidad, antecedentesPersonales, oftalmologia y ginecologia. Opciones estructuradas en español; codigoEspecialidad conserva el código del catálogo. Claves heredadas aceptadas solo como compatibilidad de entrada.'}
                templateId: {type: string, format: uuid, description: 'Extensión opcional compatible; la UI especialista envía la plantilla consultada. Si cambió la activa devuelve 409 sin cambios; actualizar contexto y confirmar de nuevo.'}
                diagnosisText: {type: [string, 'null'], maxLength: 2000}
                instructions: {type: [string, 'null'], maxLength: 8000}
                followUpText: {type: [string, 'null'], maxLength: 4000}
                bloodChemistryStatus: {type: string, enum: [NOT_PRESENTED, PENDING, ATTACHED]}
                referralSpecialtyId: {type: [string, 'null'], format: uuid}
                referralReason: {type: [string, 'null'], maxLength: 2000}
                referralComment: {type: [string, 'null'], maxLength: 4000}
                referralPriority: {type: string, enum: [ROUTINE, PRIORITY, URGENT]}
      responses:
        '200':
          description: 'Revisión: data conserva encounterId/referralId (null sin derivación)/reviewHistoryVersion. Especialidad: exactamente encounterId/specialtyHistoryVersion/specialtyHistoryId. Resumen clínico, ficha/plantilla, diagnóstico, cita ATTENDED, evento y auditoría se confirman en una transacción.'
          content: {application/json: {schema: {type: object, required: [ok, data], properties: {ok: {type: boolean, const: true}, data: {type: object}}}}}
        '400': {description: Motivo/evaluación/ficha o datos de derivación inválidos.}
        '401': {description: Sesión ausente o caducada.}
        '403': {description: Rol/CSRF sin permiso.}
        '404': {description: Encuentro ajeno/inexistente.}
        '409': {description: Atención cerrada, cita no atendible, antecedentes requeridos o documento ATTACHED no disponible; sin cambios parciales.}
  /api/medical/encounters/{encounterId}/amendments:
    get:
      summary: Consultar adendas de una atención cerrada autorizada
      description: 'Revisión/especialista con acceso longitudinal FE-17. La lectura de un origen remitido o de otro autor del área no habilita escritura. canAdd procede del servidor; solo el autor activo y autorizado puede agregar. Orden por amendmentNo/id ascendente. Audita lectura sin texto clínico; no-store, private.'
      security: [{sessionCookie: []}]
      parameters:
        - {name: encounterId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: 'ok/data(canAdd,items[]); sin adendas items:[]. clientRequestId es null en registros anteriores.'
          content: {application/json: {schema: {type: object, properties: {ok: {const: true}, data: {type: object, required: [canAdd, items], properties: {canAdd: {type: boolean}, items: {type: array, items: {$ref: '#/components/schemas/EncounterAmendment'}}}}}}}}
        '401': {description: Sesión requerida.}
        '403': {description: Rol/relación/área no autorizada o encuentro no cerrado; sin contenido clínico.}
    post:
      summary: Agregar una adenda sin modificar el original
      description: 'Autor de encuentro CLOSED, personal activo y ámbito FE-17 vigente. Tabla append-only. Número serializado por encuentro; adenda y auditoría atómicas. clientRequestId es una extensión opcional: mismo actor/encuentro/envío/contenido devuelve el mismo resultado; contenido distinto para la misma clave 409. Sin clave se conserva la semántica anterior de nueva adenda por solicitud. No existe PUT/PATCH/DELETE de adendas.'
      security: [{sessionCookie: [], csrfSession: []}]
      parameters:
        - {name: encounterId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, content]
              properties:
                reason: {type: string, minLength: 1, maxLength: 1000}
                content: {type: string, minLength: 1, maxLength: 8000}
                clientRequestId: {type: [string, 'null'], format: uuid}
      responses:
        '200':
          description: 'Contrato de creación conservado: ok/data(id,amendmentNo,createdAt,createdBy). createdAt ISO y createdBy UUID del actor de sesión.'
          content: {application/json: {schema: {type: object, properties: {ok: {const: true}, data: {type: object, required: [id, amendmentNo, createdAt, createdBy], properties: {id: {type: string, format: uuid}, amendmentNo: {type: integer}, createdAt: {type: string, format: date-time}, createdBy: {type: string, format: uuid}}}}}}}
        '400': {description: Motivo/contenido ausentes, vacíos, tipo/límite inválido o UUID de reintento inválido; error texto.}
        '401': {description: Sesión requerida.}
        '403': {description: Autor/rol/área no autorizado o encuentro no cerrado.}
        '409': {description: Clave de envío ya usada con otro contenido; consultar antes de iniciar una nueva adenda.}
        '500': {description: Fallo recuperable; comprobar estado antes de reintentar.}
  /api/medical/encounters/{encounterId}/source-context:
    get:
      summary: Contexto remitido autorizado para el especialista asignado
      operationId: getOwnSpecialtySource
      security: [{sessionCookie: []}]
      parameters:
        - {name: encounterId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: 'ok/data. data=null en atención directa. Si derivada: referralId/reason/comment/priority/sourceEncounter(id/chiefComplaint/assessment), diagnoses(textos) y documents(id/fileName/documentType), ordenados por fecha. Solo elementos compartidos del mismo paciente/origen; documentos AVAILABLE. Audita actor sin texto clínico.'
          content: {application/json: {schema: {type: object, required: [ok, data], properties: {ok: {type: boolean, const: true}, data: {type: [object, 'null']}}}}}
        '401': {description: Sesión ausente o caducada.}
        '403': {description: Rol sin permiso.}
        '404': {description: Encuentro ajeno o inexistente.}
  /api/medical/patients/{patientId}:
    get:
      summary: Historia longitudinal autorizada por relación clínica y área
      description: 'Requiere personal activo y relación por encuentro propio, derivación asignada o cita propia SCHEDULED/CHECKED_IN/ATTENDED. Revisión ve INITIAL. Especialista ve SPECIALTY de áreas activas con afiliación vigente y los INITIAL remitidos a su persona/área. La autorización se aplica en PostgreSQL a todos los arrays. Historia vacía autorizada devuelve 200/listas vacías; sin acceso devuelve 404 con error texto de referencia. Audita actor sin texto clínico; Cache-Control no-store, private.'
      security: [{sessionCookie: []}]
      parameters:
        - {name: patientId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: 'Conserva ok/data(patient,intake,clinicalBackground,encounters,diagnoses,documents,appointments,referrals) y agrega emergencyContact (A-02, solo lectura). No ordena ni filtra por área en el cliente.'
          content: {application/json: {schema: {type: object, required: [ok, data], properties: {ok: {const: true}, data: {$ref: '#/components/schemas/LongitudinalHistory'}}}}}
        '401': {description: Sesión ausente o caducada.}
        '403': {description: Administración/estudiante/rol no clínico no reciben contenido clínico.}
        '404': {description: 'No tienes acceso clínico a este paciente.'}
        '500': {description: Error de consulta recuperable sin detalles internos.}
  /api/medical/patients/{patientId}/search:
    get:
      summary: Buscar en la historia cerrada autorizada por fechas y texto
      description: 'Usa exactamente la relación/área/origen de la historia longitudinal. Solo CLOSED, orden occurredAt/id descendente. Texto parcial literal sin distinguir mayúsculas/acentos ni espacios repetidos; Unicode compuesto/descompuesto equivalente. Busca motivo/evaluación/indicaciones/seguimiento/especialidad, diagnósticos, adendas, valores textuales de fichas y antecedentes vinculados, nombre/descripción de documentos AVAILABLE. No busca antecedentes globales posteriores no vinculados ni claves técnicas del JSON. Auditoría sin texto de búsqueda. Cache-Control no-store, private.'
      security: [{sessionCookie: []}]
      parameters:
        - {name: patientId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: q, in: query, schema: {type: string, maxLength: 200}, description: Vacío equivale a todo el texto; '%' y '_' son literales.}
        - {name: from, in: query, schema: {type: string, format: date}, description: Día inicial inclusivo en America/La_Paz; opcional.}
        - {name: to, in: query, schema: {type: string, format: date}, description: Día final inclusivo en America/La_Paz; opcional.}
      responses:
        '200':
          description: 'ok/data[]; cero coincidencias []. Campos null preservados, incluida specialty:null en INITIAL.'
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: {const: true}
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, occurredAt, encounterType, status, chiefComplaint, assessment, specialty]
                      properties:
                        id: {type: string, format: uuid}
                        occurredAt: {type: string, format: date-time}
                        encounterType: {enum: [INITIAL, SPECIALTY]}
                        status: {const: CLOSED}
                        chiefComplaint: {type: [string, 'null']}
                        assessment: {type: [string, 'null']}
                        specialty: {type: [string, 'null']}
        '400': {description: Texto mayor de 200 caracteres, fechas mal formadas o rango invertido; error texto.}
        '401': {description: Sesión ausente o caducada.}
        '403': {description: Rol no clínico sin permiso.}
        '404': {description: 'No tienes acceso clínico a este paciente.'}
        '500': {description: Fallo recuperable de consulta sin detalles internos.}
  /api/medical/patients/{patientId}/clinical-background:
    parameters:
      - name: patientId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      summary: Antecedentes globales y versión vinculada a una atención propia
      operationId: getClinicalBackground
      security: [{sessionCookie: []}]
      parameters:
        - name: encounterId
          in: query
          required: false
          description: Extensión para consultar la versión vinculada a una atención propia, incluso cerrada.
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Mantiene data.current y data.encounter, ambos null si no existe una versión. Sin encounterId, encounter es null.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: {type: boolean, const: true}
                  data:
                    type: object
                    required: [current, encounter]
                    properties:
                      current: {oneOf: [{$ref: '#/components/schemas/ClinicalBackgroundVersion'}, {type: 'null'}]}
                      encounter: {oneOf: [{$ref: '#/components/schemas/ClinicalBackgroundVersion'}, {type: 'null'}]}
        '401': {description: Sesión ausente o caducada.}
        '403': {description: Rol sin permiso clínico.}
        '404': {description: Paciente o encuentro ajeno/inexistente, sin exposición clínica.}
    patch:
      summary: Actualiza antecedentes con motivo y versión esperada
      operationId: saveClinicalBackground
      security: [{sessionCookie: [], csrfSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data, changeReason, expectedVersion]
              properties:
                data: {type: object, description: 'versionEsquema=1; alergias/enfermedadesPersonales/cirugias/medicamentos/antecedentesFamiliares con estado PRESENTE/NINGUNO/DESCONOCIDO y elementos ordenados (máx. 50 de 500 caracteres); habitos con alimentacion/actividadFisica/tabaco/alcohol. Opciones ADECUADA/REGULAR/INADECUADA y SI/NO. Claves heredadas admitidas como entrada, sin mezclar alias; datos persistidos y respuestas en español.'}
                changeReason: {type: string, minLength: 1, maxLength: 500}
                expectedVersion: {type: integer, minimum: 0}
                encounterId: {type: [string, 'null'], format: uuid}
      responses:
        '200':
          description: Nueva versión, autor, fecha y motivo; vinculación solo a encuentro propio DRAFT, en una transacción.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: {type: boolean, const: true}
                  data: {$ref: '#/components/schemas/ClinicalBackgroundVersion'}
        '400': {description: Motivo/datos inválidos o versión esperada ausente, negativa o fraccionaria.}
        '401': {description: Sesión ausente o caducada.}
        '403': {description: Rol/CSRF sin permiso.}
        '404': {description: Paciente o encuentro ajeno/inexistente.}
        '409': {description: Versión desactualizada o encuentro cerrado; sin cambios parciales.}
  /api/medical/appointments:
    get:
      summary: Agenda del profesional autenticado, con identidad y referencia al encuentro
      description: Conserva los campos heredados y agrega encounter (null o id/status). Incluye todas las citas activas (SCHEDULED, CHECKED_IN o con encuentro DRAFT) y las 200 cerradas más recientes, en orden ascendente por horario e id. No crea encuentros.
      operationId: listMyMedicalAppointments
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Lista autorizada; sin citas devuelve data vacío.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: {type: boolean, const: true}
                  data: {type: array, items: {$ref: '#/components/schemas/MedicalAgendaAppointment'}}
        '401': {description: Sesión ausente o caducada; error como texto.}
        '403': {description: Rol distinto de médico de revisión o especialista.}
        '404': {description: Cuenta médica sin ficha de personal activa.}
  /api/medical/appointments/{appointmentId}:
    get:
      summary: Una cita propia del profesional autenticado
      description: Mismo contrato que un elemento de la agenda, para citas activas o cerradas. Solo citas asignadas al personal del actor y del tipo de su rol (INITIAL para médico de revisión, SPECIALTY para especialista). No crea encuentros.
      operationId: getMyMedicalAppointment
      security: [{sessionCookie: []}]
      parameters:
        - {name: appointmentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Cita autorizada.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: {type: boolean, const: true}
                  data: {$ref: '#/components/schemas/MedicalAgendaAppointment'}
        '401': {description: Sesión ausente o caducada; error como texto.}
        '403': {description: Rol distinto de médico de revisión o especialista.}
        '404': {description: Cita inexistente, ajena o de otro tipo; no distingue entre esos casos.}
  /api/medical/appointments/{appointmentId}/start:
    post:
      summary: Inicia o recupera el encuentro de una cita propia
      description: Solo cita SCHEDULED o CHECKED_IN del profesional autorizado. La apertura concurrente crea un único encuentro y un único evento de creación. Especialistas requieren especialidad propia vigente.
      operationId: startMyMedicalEncounter
      security: [{sessionCookie: [], csrfSession: []}]
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '201':
          description: Encuentro creado.
          content: {application/json: {schema: {$ref: '#/components/schemas/MedicalEncounterStartSuccess'}}}
        '200':
          description: Encuentro existente recuperado, con el mismo UUID.
          content: {application/json: {schema: {$ref: '#/components/schemas/MedicalEncounterStartSuccess'}}}
        '400': {description: UUID o solicitud inválidos.}
        '401': {description: Sesión ausente o caducada.}
        '403': {description: Rol, especialidad o CSRF no autorizados.}
        '404': {description: Cita ajena o inexistente, sin exposición clínica.}
        '409': {description: Estado de cita no iniciable.}
  /api/health:
    get:
      summary: Estado agregado del backend, sin dependencia de Supabase
      operationId: backendHealth
      responses:
        '200':
          description: Backend disponible.
          content:
            application/json:
              schema:
                type: object
                required: [ok, service, status]
                properties:
                  ok: {type: boolean, const: true}
                  service: {type: string, const: backend}
                  status: {type: string, const: UP}
                  error: {type: 'null'}
        '503':
          description: Alguna dependencia crítica no está disponible.
          content:
            application/json:
              schema:
                type: object
                required: [ok, service, status, error]
                properties:
                  ok: {type: boolean, const: false}
                  service: {type: string, const: backend}
                  status: {type: string}
                  error: {type: string, const: backend_unavailable}
  /api/careers:
    get:
      summary: Lista carreras activas en el contrato heredado
      operationId: listLegacyCareers
      responses:
        '200':
          description: Carreras activas ordenadas por nombre y código.
          content: {application/json: {schema: {$ref: '#/components/schemas/LegacyCatalogSuccess'}}}
  /api/patients:
    get:
      summary: Busca pacientes desde administración en el contrato heredado
      operationId: listLegacyPatients
      security: [{sessionCookie: []}]
      parameters:
        - name: query
          in: query
          required: false
          schema: {type: string, maxLength: 80}
      responses:
        '200': {description: Pacientes ordenados por apellido y nombre., content: {application/json: {schema: {$ref: '#/components/schemas/LegacyPatientListSuccess'}}}}
        '401': {description: Forma heredada no autenticada.}
        '403': {description: Forma heredada forbidden.}
    post:
      summary: Registra un paciente y su historia longitudinal única
      operationId: createLegacyPatient
      security: [{sessionCookie: [], csrfSession: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PatientRequest'}}}
      responses:
        '201': {description: Paciente creado, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyPatientIdSuccess'}}}}
        '409': {description: Carnet o código normalizado duplicado.}
        '403': {description: Forma heredada forbidden para CSRF o actor sin rol administrativo.}
  /api/patients/{patientId}:
    get:
      summary: Obtiene un paciente administrativo en el contrato heredado
      operationId: getLegacyPatient
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/PatientId'
      responses:
        '200': {description: 'Paciente encontrado. A-02: además de los campos del listado incluye emergencyContact (null si no tiene).', content: {application/json: {schema: {$ref: '#/components/schemas/LegacyPatientDetailSuccess'}}}}
        '404': {description: Estudiante no encontrado.}
    patch:
      summary: Actualiza un paciente sin cambiar su UUID
      operationId: updateLegacyPatient
      security: [{sessionCookie: [], csrfSession: []}]
      parameters:
        - $ref: '#/components/parameters/PatientId'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PatientRequest'}}}
      responses:
        '200': {description: Paciente actualizado, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyPatientIdSuccess'}}}}
        '404': {description: Estudiante no encontrado.}
        '409': {description: Carnet o código normalizado duplicado.}
        '403': {description: Forma heredada forbidden para CSRF o actor sin rol administrativo.}
  /api/specialties:
    get:
      summary: Lista especialidades activas en el contrato heredado
      operationId: listLegacySpecialties
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Especialidades activas, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyCatalogSuccess'}}}}
        '401': {description: Forma heredada no autenticada.}
        '403': {description: Forma heredada forbidden.}
  /api/my-specialties:
    get:
      summary: Lista especialidades vigentes del profesional actual
      operationId: listMySpecialties
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Especialidades vigentes, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyCatalogSuccess'}}}}
  /api/v1/catalogs/{kind}:
    get:
      summary: Lista un catálogo clínico activo
      operationId: listCatalog
      security: [{sessionCookie: []}]
      parameters:
        - name: kind
          in: path
          required: true
          schema: {type: string, enum: [CAREER, SPECIALTY, CONDITION, MEASUREMENT, TAG, DOCUMENT_TYPE]}
      responses:
        '200': {description: Catálogo activo, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogSuccess'}}}}
  /api/v1/admin/catalogs/{kind}:
    post:
      summary: Crea o actualiza lógicamente un catálogo como administrativo
      operationId: saveCatalog
      security: [{sessionCookie: [], csrfSession: []}]
      parameters:
        - name: kind
          in: path
          required: true
          schema: {type: string, enum: [CAREER, SPECIALTY, CONDITION, MEASUREMENT, TAG, DOCUMENT_TYPE]}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CatalogSaveRequest'}}}
      responses:
        '200': {description: Catálogo guardado, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogSuccess'}}}}
        '403': {$ref: '#/components/responses/CsrfInvalid'}
  /api/v1/auth/login:
    post:
      summary: Autentica credenciales y crea una sesión opaca en cookie HttpOnly
      operationId: login
      security:
        - csrfSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión creada; el token solo se entrega en cookie.
          headers:
            Set-Cookie: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginSuccess'}
        '401':
          description: Credenciales inválidas o límite de intentos aplicado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403': {$ref: '#/components/responses/CsrfInvalid'}
  /api/v1/profile:
    patch:
      summary: Actualiza nombre y correo tras comprobar la contraseña actual
      operationId: updateProfile
      security: [{sessionCookie: [], csrfSession: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ProfileUpdateRequest'}}}
      responses:
        '204':
          description: Perfil actualizado; todas las sesiones se revocan y la cookie actual se borra.
          headers: {Set-Cookie: {schema: {type: string}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '409': {description: El correo ya está usado por otra cuenta.}
        '403': {$ref: '#/components/responses/CsrfInvalid'}
  /api/v1/profile/password:
    post:
      summary: Cambia la contraseña tras comprobar la contraseña actual
      operationId: changePassword
      security: [{sessionCookie: [], csrfSession: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PasswordChangeRequest'}}}
      responses:
        '204':
          description: Contraseña cambiada; todas las sesiones se revocan y la cookie actual se borra.
          headers: {Set-Cookie: {schema: {type: string}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CsrfInvalid'}
  /api/v1/security/csrf:
    get:
      summary: Crea o recupera el token CSRF de la sesión HTTP actual
      operationId: getCsrfToken
      responses:
        '200':
          description: Token CSRF y metadatos de envío
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfSuccess'
  /api/v1/session:
    get:
      summary: Inspecciona el sujeto y autoridades de una sesión autenticada
      operationId: getSessionProbe
      responses:
        '200':
          description: Sesión autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/session/logout:
    post:
      summary: Invalida la sesión actual
      operationId: logout
      security:
        - csrfSession: []
      responses:
        '204':
          description: Sesión invalidada
        '403':
          $ref: '#/components/responses/CsrfInvalid'
  /api/me:
    get:
      summary: Contrato de compatibilidad de identidad del frontend actual
      operationId: legacyMe
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Usuario y rol prioritario activo.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LegacyMeSuccess'}
        '401':
          description: Forma heredada exacta {ok:false,error:unauthenticated}.
  /api/reports/compliance:
    get:
      description: Solo ADMINISTRATIVE/REPORTING_OFFICER. Una fila por paciente/carrera/período; sin período se consultan matrículas activas vigentes, con período explícito se admite historial. Solo CLOSED dentro de la ventana inclusiva de matrícula en Bolivia computa; llegada/ausencia/borrador no cumplen. Mantiene el orden nominal por apellidos/nombres/UUID y null de primer cierre. Devuelve ok/data (lista vacía válida), audita sin contenido clínico y no-store/private; fallo de infraestructura 500. Regla académica del modelo actual, pendiente de validación institucional.

      summary: Consulta cumplimiento institucional por carrera y período académico
      operationId: institutionalCompliance
      security: [{sessionCookie: []}]
      parameters:
        - name: careerId
          in: query
          required: false
          schema: {type: string, format: uuid}
        - name: period
          in: query
          required: false
          schema: {type: string, maxLength: 80}
      responses:
        '200': {description: Cumplimiento por paciente inscrito, incluyendo pendientes., content: {application/json: {schema: {$ref: '#/components/schemas/LegacyComplianceSuccess'}}}}
        '400': {description: Período académico inválido.}
        '401': {description: Sesión ausente o caducada; error texto.}
        '403': {description: Sólo administración o responsable de reportes.}
        '500': {description: Error recuperable; error texto y sin lista vacía de sustitución.}
  /api/reports/daily-activity:
    get:
      description: Solo ADMINISTRATIVE/REPORTING_OFFICER. Fechas inclusivas de Bolivia, por omisión hoy. Máximo 366 días de diferencia; rango inválido 400. Solo CLOSED; grupos por día/tipo/especialidad con null conservado y orden de referencia. Ámbito institucional independiente de carrera/período de matrícula. ok/data, auditoría y no-store/private; error recuperable 500.

      summary: Agrega atenciones cerradas por día, tipo y especialidad
      operationId: dailyInstitutionalActivity
      security: [{sessionCookie: []}]
      parameters:
        - name: from
          in: query
          required: false
          schema: {type: string, format: date}
        - name: to
          in: query
          required: false
          schema: {type: string, format: date}
      responses:
        '200': {description: Agregados de sólo encuentros cerrados., content: {application/json: {schema: {$ref: '#/components/schemas/LegacyDailyActivitySuccess'}}}}
        '400': {description: Rango inválido o superior a 366 días.}
        '401': {description: Sesión ausente o caducada; error texto.}
        '403': {description: Sólo administración o responsable de reportes.}
        '500': {description: Error recuperable; error texto y sin lista vacía de sustitución.}
  /api/audit-events:
    get:
      summary: Consulta evidencia de auditoría sin exponer contenido clínico ni detalles sensibles
      description: Solo autoridad AUDITOR vigente. Fechas inclusivas de Bolivia. Filtros parciales literales sin distinguir mayúsculas. Nombre y roles del actor son los vigentes; no son una instantánea histórica. No devuelve metadata cruda ni texto clínico. Cada lectura agrega un evento propio, sin alterar evidencia previa. Cache-Control no-store, private.
      operationId: listAuditEvents
      security: [{sessionCookie: []}]
      parameters:
        - name: from
          in: query
          required: false
          schema: {type: string, format: date}
        - name: to
          in: query
          required: false
          schema: {type: string, format: date}
        - name: actorId
          in: query
          required: false
          schema: {type: string, format: uuid}
        - name: action
          in: query
          required: false
          schema: {type: string}
        - name: resource
          in: query
          required: false
          schema: {type: string}
        - name: outcome
          in: query
          required: false
          schema: {type: string, enum: [SUCCESS, DENIED, FAILURE]}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
        - name: actor
          in: query
          description: Coincidencia parcial por nombre, correo o UUID; máximo 200 caracteres.
          schema: {type: string, maxLength: 200}
        - name: paginated
          in: query
          schema: {type: boolean, default: false}
        - name: before
          in: query
          description: Cursor opaco devuelto en pagination.nextCursor; requiere paginated=true. Orden estable por instante y UUID descendentes.
          schema: {type: string, maxLength: 120}
      responses:
        '200': {description: Eventos ordenados de más reciente a más antiguo., content: {application/json: {schema: {$ref: '#/components/schemas/LegacyAuditEventListSuccess'}}}}
        '400': {description: Filtros inválidos.}
        '401': {description: Sesión ausente o expirada.}
        '403': {description: Sólo Auditor.}
        '500': {description: Error recuperable al consultar persistencia.}
  /api/vaccines:
    get:
      summary: Lista vacunas y su última versión de esquema (Administración y Reportes; escritura sólo Administración)
      operationId: listVaccines
      security: [{sessionCookie: []}]
      parameters:
        - name: includeInactive
          in: query
          required: false
          schema: {type: boolean, default: false}
      responses:
        '200': {description: Catálogo administrativo de vacunas., content: {application/json: {schema: {$ref: '#/components/schemas/LegacyVaccineListSuccess'}}}}
        '403': {description: Sólo Administración.}
    post:
      summary: Crea una vacuna y la primera versión de su esquema de dosis
      operationId: createVaccine
      security: [{sessionCookie: [], csrfSession: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/VaccineRequest'}}}
      responses:
        '201': {description: Vacuna creada., content: {application/json: {schema: {$ref: '#/components/schemas/LegacyVaccineIdSuccess'}}}}
        '400': {description: Esquema inválido.}
        '403': {description: Sólo Administración.}
        '409': {description: Ya existe una vacuna con ese código (sin distinguir mayúsculas).}
  /api/vaccines/{vaccineId}:
    put:
      summary: Crea una versión de esquema y permite activar o desactivar una vacuna sin borrar historia
      operationId: updateVaccine
      security: [{sessionCookie: [], csrfSession: []}]
      parameters:
        - name: vaccineId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/VaccineRequest'}}}
      responses:
        '200': {description: Vacuna actualizada., content: {application/json: {schema: {$ref: '#/components/schemas/LegacyVaccineIdSuccess'}}}}
        '400': {description: Esquema inválido.}
        '403': {description: Sólo Administración.}
        '404': {description: Vacuna inexistente.}
        '409': {description: Código duplicado o expectedSchemaVersion distinta de la última versión; no se crea otra versión.}
  /api/vaccinations:
    post:
      summary: Registra una dosis aplicada y conserva aplicador, registrador y versión del esquema
      operationId: applyVaccinationDose
      security: [{sessionCookie: [], csrfSession: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/VaccinationApplicationRequest'}}}
      responses:
        '201': {description: Dosis registrada., content: {application/json: {schema: {$ref: '#/components/schemas/LegacyVaccinationApplicationSuccess'}}}}
        '400': {description: Datos incompletos, fecha futura en Bolivia o anterior a la dosis previa, aplicador que no es médico de revisión activo o justificación mayor a 500 caracteres.}
        '403': {description: Sólo Administración o Médico de revisión; un médico sólo se indica a sí mismo como aplicador.}
        '404': {description: Paciente inexistente o, para Médico de revisión, sin cita inicial asignada con ese paciente.}
        '409': {description: Dosis ya registrada, dosis anterior pendiente, vacuna inactiva o dosis fuera del esquema vigente.}
        '422': {description: No se cumple el intervalo mínimo y falta intervalOverrideJustification.}
  /api/vaccinations/context:
    get:
      summary: Contexto para registrar dosis desde la ficha del paciente
      description: Vacunas activas con esquema vigente y siguiente dosis calculada en servidor, dosis aplicadas (incluidas vacunas desactivadas) con lote, aplicador y registrador, y aplicadores elegibles. Cada lectura se audita como VACCINATION_RECORD_READ.
      operationId: getVaccinationRegistrationContext
      security: [{sessionCookie: []}]
      parameters:
        - name: patientId
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Contexto de registro., content: {application/json: {schema: {$ref: '#/components/schemas/LegacyVaccinationContextSuccess'}}}}
        '400': {description: Paciente omitido.}
        '403': {description: Sólo Administración o Médico de revisión.}
        '404': {description: Paciente inexistente o ajeno a la atención del médico.}
  /api/vaccination-card:
    get:
      summary: Consulta el carnet y estado de vacunación autorizado
      operationId: getVaccinationCard
      security: [{sessionCookie: []}]
      parameters:
        - name: patientId
          in: query
          required: false
          schema: {type: string, format: uuid}
          description: Requerido para Administración; un estudiante sólo puede consultar su propio carnet.
      responses:
        '200': {description: 'Carnet y estado calculado con la última versión del esquema. Incluye vacunas activas y desactivadas sólo si el paciente tiene dosis; cada dosis trae lote, aplicador y versión histórica. Cada lectura se audita como VACCINATION_CARD_READ.', content: {application/json: {schema: {$ref: '#/components/schemas/LegacyVaccinationCardSuccess'}}}}
        '400': {description: Administración sin patientId.}
        '403': {description: No autorizado para ese carnet.}
        '404': {description: Paciente inexistente.}
  /api/reports/vaccination-coverage:
    get:
      summary: Cobertura agregada por vacuna, carrera y período académico
      operationId: getVaccinationCoverage
      security: [{sessionCookie: []}]
      parameters:
        - name: careerId
          in: query
          required: false
          schema: {type: string, format: uuid}
        - name: academicPeriod
          in: query
          required: false
          schema: {type: string, maxLength: 80}
      responses:
        '200': {description: 'Cobertura agregada de vacunas activas; sin período usa matrículas vigentes en día de Bolivia. Cada estudiante cuenta una vez por vacuna/carrera/período. Lectura auditada como VACCINATION_COVERAGE_READ.', content: {application/json: {schema: {$ref: '#/components/schemas/LegacyVaccinationCoverageSuccess'}}}}
        '403': {description: Sólo Administración o Reportes.}
        '400': {description: Filtros inválidos.}
  /api/research/exports:
    post:
      summary: Descarga un conjunto de investigación seudonimizado y su diccionario
      operationId: exportPseudonymizedResearchDataset
      security: [{sessionCookie: [], csrfSession: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ResearchExportRequest'}}}
      description: 'No exige aprobación previa (RN-32). El archivo se genera completo antes de responder; registra solicitante, finalidad, filtros normalizados, formato, filas, política, mes de política y SHA-256, y audita RESEARCH_EXPORT_COMPLETED. Fechas y mes en hora de Bolivia.'
      responses:
        '200':
          description: CSV dentro de ZIP (research-data.csv y dictionary.csv, UTF-8 con BOM) o XLSX con hojas Research data y Dictionary; sin identificadores directos.
          headers:
            X-Export-Id: {schema: {type: string, format: uuid}}
            X-Export-Row-Count: {schema: {type: integer, minimum: 0, maximum: 10000}}
            X-Content-SHA256: {schema: {type: string, pattern: '^[0-9a-f]{64}$'}}
            X-Pseudonym-Policy: {description: 'Versión y mes de política, p. ej. MONTHLY-V1;2026-10.', schema: {type: string}}
            X-Excluded-Declined: {description: 'A-03: pacientes con atenciones dentro de los filtros que quedaron fuera por responder No a investigación.', schema: {type: integer, minimum: 0}}
            X-Excluded-Unanswered: {description: 'A-03: pacientes con atenciones dentro de los filtros que quedaron fuera por no haber respondido la versión vigente.', schema: {type: integer, minimum: 0}}
          content:
            application/zip: {schema: {type: string, format: binary}}
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {schema: {type: string, format: binary}}
        '400': {description: 'Finalidad (3-300), formato, filtros (claves desconocidas, fecha inválida, desde posterior a hasta, UUID inválido) o más de 10000 filas.'}
        '403': {description: Sólo Administración o Responsable de Reportes.}
        '500': {description: No se pudo generar el archivo completo; no se registra exportación.}
  /api/research/exports/{exportId}:
    get:
      summary: Constancia de una exportación de investigación propia
      operationId: getResearchExportProvenance
      security: [{sessionCookie: []}]
      parameters:
        - {name: exportId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 'Datos {id, purpose, filters, format, rowCount, policyVersion, policyMonth, sha256, createdAt, excludedDeclined, excludedUnanswered} dentro del sobre {ok,data,error}. Los conteos de excluidos son null en exportaciones anteriores a A-03.'}
        '403': {description: Sólo Administración o Responsable de Reportes.}
        '404': {description: No existe o pertenece a otro solicitante.}
components:
  parameters:
    PatientId:
      name: patientId
      in: path
      required: true
      schema: {type: string, format: uuid}
  headers:
    RequestId:
      description: Identificador de trazabilidad aceptado o generado por el servidor.
      schema:
        type: string
  securitySchemes:
    csrfSession:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: Requiere la cookie de sesión obtenida junto con GET /api/v1/security/csrf.
    sessionCookie:
      type: apiKey
      in: cookie
      name: SALUD_U_SESSION
  responses:
    NotificationInvalid:
      description: Parámetros o cuerpo inválidos.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/NotificationError'}
    NotificationUnauthenticated:
      description: Sesión ausente o caducada.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/NotificationError'}
    NotificationFailure:
      description: Fallo recuperable con mensaje sanitizado; no se devuelve una bandeja vacía como sustituto.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/NotificationError'}
    Unauthenticated:
      description: Falta una sesión autenticada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CsrfInvalid:
      description: Falta, expiró o no coincide el token CSRF.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Notification:
      type: object
      required: [id, appointmentId, eventType, channel, subject, message, status, scheduledFor, deliveredAt, readAt, createdAt]
      properties:
        id: {type: string, format: uuid}
        appointmentId: {type: string, format: uuid}
        eventType: {type: string, enum: [APPOINTMENT_ASSIGNED, APPOINTMENT_CANCELLED, APPOINTMENT_NO_SHOW, APPOINTMENT_RESCHEDULED, APPOINTMENT_REMINDER, APPOINTMENT_REMINDER_REINFORCED]}
        channel: {type: string, enum: [INBOX]}
        subject: {type: string}
        message: {type: string, description: Texto operativo sin motivos privados ni contenido clínico}
