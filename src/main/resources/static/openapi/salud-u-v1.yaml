openapi: 3.1.0
info:
  title: Salud-U API
  version: 1.0.0-draft
  description: |
    Contrato base de la API Spring. Publica rutas de compatibilidad /api para el
    frontend Next actual y contratos versionados /api/v1 para identidad y
    administración. Las rutas de compatibilidad se comparan con los fixtures de
    docs/reference-t01 antes de cada migración funcional.
servers:
  - url: http://localhost:8080
paths:
  /api/medical/encounters/{encounterId}:
    get:
      summary: Contexto del encuentro propio para editar o consultar su ficha
      description: Lectura nueva y acotada al médico asignado. Incluye paciente, cita, encuentro, antecedentes current/encounter, diagnósticos, mediciones y metadatos de documentos disponibles, sin consultar toda la historia longitudinal.
      operationId: getOwnEncounterContext
      security: [{sessionCookie: []}]
      parameters:
        - name: encounterId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Contexto autorizado; listas vacías y campos null conservados. Lectura auditada sin texto clínico en detalles.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: {type: boolean, const: true}
                  data:
                    type: object
                    required: [encounter, patient, appointment, clinicalBackground, diagnoses, measurements, documents]
                    properties:
                      encounter: {type: object, description: 'id/status/type, chiefComplaint, assessment, instructions, followUpText, bloodChemistryStatus, reviewHistory y reviewHistoryVersion; null antes del cierre.'}
                      patient: {type: object}
                      appointment: {type: object}
                      clinicalBackground: {type: object}
                      diagnoses: {type: array, items: {type: object}}
                      measurements: {type: array, items: {type: object}}
                      documents: {type: array, items: {type: object}}
        '401': {description: Sesión ausente o caducada.}
        '403': {description: Actor sin rol clínico.}
        '404': {description: Encuentro ajeno/inexistente, sin exposición clínica.}
  /api/medical/encounters/{encounterId}/finalize:
    post:
      summary: Persiste y cierra la ficha del encuentro propio de forma atómica
      description: Conserva el contrato de cierre caracterizado. No guarda borradores; la ficha de revisión se normaliza en Spring (incluidos null y número vacío como cero del handler heredado). La versión aumenta por paciente; mediciones incluyen talla en cm e IMC. Atención cerrada inmutable y doble cierre rechazado.
      operationId: finalizeOwnEncounter
      security: [{sessionCookie: [], csrfSession: []}]
      parameters:
        - name: encounterId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chiefComplaint, assessment]
              properties:
                chiefComplaint: {type: string, minLength: 1, maxLength: 4000}
                assessment: {type: string, minLength: 1, maxLength: 8000}
                reviewHistory: {type: object, description: 'JSON clínico canónico en español: versionEsquema=1, sexo, antecedentesPersonales, habitos, signosVitales, examenFisico, laboratorio, conducta y observaciones. Opciones SI/NO, ADECUADA/REGULAR/INADECUADA. Si se omite se aplican valores predeterminados. Claves heredadas aceptadas como entrada; salida siempre en español. No mezclar alias.'}
                specialtyHistory: {type: object, description: 'Obligatorio para especialista: versionEsquema=1, codigoEspecialidad, antecedentesPersonales, oftalmologia y ginecologia. Opciones estructuradas en español; codigoEspecialidad conserva el código del catálogo. Claves heredadas aceptadas solo como compatibilidad de entrada.'}
                diagnosisText: {type: [string, 'null'], maxLength: 2000}
                instructions: {type: [string, 'null'], maxLength: 8000}
                followUpText: {type: [string, 'null'], maxLength: 4000}
                bloodChemistryStatus: {type: string, enum: [NOT_PRESENTED, PENDING, ATTACHED]}
                referralSpecialtyId: {type: [string, 'null'], format: uuid}
                referralReason: {type: [string, 'null']}
                referralComment: {type: [string, 'null']}
                referralPriority: {type: string, enum: [ROUTINE, PRIORITY, URGENT]}
      responses:
        '200':
          description: Para revisión, data conserva encounterId/referralId (null sin derivación)/reviewHistoryVersion. Ficha/diagnóstico/mediciones/cita/eventos se confirman en una transacción.
          content: {application/json: {schema: {type: object, required: [ok, data], properties: {ok: {type: boolean, const: true}, data: {type: object}}}}}
        '400': {description: Motivo/evaluación/ficha o datos de derivación inválidos.}
        '401': {description: Sesión ausente o caducada.}
        '403': {description: Rol/CSRF sin permiso.}
        '404': {description: Encuentro ajeno/inexistente.}
        '409': {description: Atención cerrada, cita no atendible, antecedentes requeridos o documento ATTACHED no disponible; sin cambios parciales.}
  /api/medical/patients/{patientId}/clinical-background:
    parameters:
      - name: patientId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      summary: Antecedentes globales y versión vinculada a una atención propia
      operationId: getClinicalBackground
      security: [{sessionCookie: []}]
      parameters:
        - name: encounterId
          in: query
          required: false
          description: Extensión para consultar la versión vinculada a una atención propia, incluso cerrada.
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Mantiene data.current y data.encounter, ambos null si no existe una versión. Sin encounterId, encounter es null.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: {type: boolean, const: true}
                  data:
                    type: object
                    required: [current, encounter]
                    properties:
                      current: {oneOf: [{$ref: '#/components/schemas/ClinicalBackgroundVersion'}, {type: 'null'}]}
                      encounter: {oneOf: [{$ref: '#/components/schemas/ClinicalBackgroundVersion'}, {type: 'null'}]}
        '401': {description: Sesión ausente o caducada.}
        '403': {description: Rol sin permiso clínico.}
        '404': {description: Paciente o encuentro ajeno/inexistente, sin exposición clínica.}
    patch:
      summary: Actualiza antecedentes con motivo y versión esperada
      operationId: saveClinicalBackground
      security: [{sessionCookie: [], csrfSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data, changeReason, expectedVersion]
              properties:
                data: {type: object, description: 'versionEsquema=1; alergias/enfermedadesPersonales/cirugias/medicamentos/antecedentesFamiliares con estado PRESENTE/NINGUNO/DESCONOCIDO y elementos ordenados (máx. 50 de 500 caracteres); habitos con alimentacion/actividadFisica/tabaco/alcohol. Opciones ADECUADA/REGULAR/INADECUADA y SI/NO. Claves heredadas admitidas como entrada, sin mezclar alias; datos persistidos y respuestas en español.'}
                changeReason: {type: string, minLength: 1, maxLength: 500}
                expectedVersion: {type: integer, minimum: 0}
                encounterId: {type: [string, 'null'], format: uuid}
      responses:
        '200':
          description: Nueva versión, autor, fecha y motivo; vinculación solo a encuentro propio DRAFT, en una transacción.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: {type: boolean, const: true}
                  data: {$ref: '#/components/schemas/ClinicalBackgroundVersion'}
        '400': {description: Motivo/datos inválidos o versión esperada ausente, negativa o fraccionaria.}
        '401': {description: Sesión ausente o caducada.}
        '403': {description: Rol/CSRF sin permiso.}
        '404': {description: Paciente o encuentro ajeno/inexistente.}
        '409': {description: Versión desactualizada o encuentro cerrado; sin cambios parciales.}
  /api/medical/appointments:
    get:
      summary: Agenda del profesional autenticado, con identidad y referencia al encuentro
      description: Conserva los campos heredados y agrega encounter (null o id/status). Orden ascendente por horario e id, máximo 200 citas. No crea encuentros.
      operationId: listMyMedicalAppointments
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Lista autorizada; sin citas devuelve data vacío.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: {type: boolean, const: true}
                  data: {type: array, items: {$ref: '#/components/schemas/MedicalAgendaAppointment'}}
        '401': {description: Sesión ausente o caducada; error como texto.}
        '403': {description: Rol distinto de médico de revisión o especialista.}
        '404': {description: Cuenta médica sin ficha de personal activa.}
  /api/medical/appointments/{appointmentId}/start:
    post:
      summary: Inicia o recupera el encuentro de una cita propia
      description: Solo cita SCHEDULED o CHECKED_IN del profesional autorizado. La apertura concurrente crea un único encuentro y un único evento de creación. Especialistas requieren especialidad propia vigente.
      operationId: startMyMedicalEncounter
      security: [{sessionCookie: [], csrfSession: []}]
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '201':
          description: Encuentro creado.
          content: {application/json: {schema: {$ref: '#/components/schemas/MedicalEncounterStartSuccess'}}}
        '200':
          description: Encuentro existente recuperado, con el mismo UUID.
          content: {application/json: {schema: {$ref: '#/components/schemas/MedicalEncounterStartSuccess'}}}
        '400': {description: UUID o solicitud inválidos.}
        '401': {description: Sesión ausente o caducada.}
        '403': {description: Rol, especialidad o CSRF no autorizados.}
        '404': {description: Cita ajena o inexistente, sin exposición clínica.}
        '409': {description: Estado de cita no iniciable.}
  /api/health:
    get:
      summary: Estado agregado del backend, sin dependencia de Supabase
      operationId: backendHealth
      responses:
        '200':
          description: Backend disponible.
          content:
            application/json:
              schema:
                type: object
                required: [ok, service, status]
                properties:
                  ok: {type: boolean, const: true}
                  service: {type: string, const: backend}
                  status: {type: string, const: UP}
                  error: {type: 'null'}
        '503':
          description: Alguna dependencia crítica no está disponible.
          content:
            application/json:
              schema:
                type: object
                required: [ok, service, status, error]
                properties:
                  ok: {type: boolean, const: false}
                  service: {type: string, const: backend}
                  status: {type: string}
                  error: {type: string, const: backend_unavailable}
  /api/careers:
    get:
      summary: Lista carreras activas en el contrato heredado
      operationId: listLegacyCareers
      responses:
        '200':
          description: Carreras activas ordenadas por nombre y código.
          content: {application/json: {schema: {$ref: '#/components/schemas/LegacyCatalogSuccess'}}}
  /api/patients:
    get:
      summary: Busca pacientes desde administración en el contrato heredado
      operationId: listLegacyPatients
      security: [{sessionCookie: []}]
      parameters:
        - name: query
          in: query
          required: false
          schema: {type: string, maxLength: 80}
      responses:
        '200': {description: Pacientes ordenados por apellido y nombre., content: {application/json: {schema: {$ref: '#/components/schemas/LegacyPatientListSuccess'}}}}
        '401': {description: Forma heredada no autenticada.}
        '403': {description: Forma heredada forbidden.}
    post:
      summary: Registra un paciente y su historia longitudinal única
      operationId: createLegacyPatient
      security: [{sessionCookie: [], csrfSession: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PatientRequest'}}}
      responses:
        '201': {description: Paciente creado, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyPatientIdSuccess'}}}}
        '409': {description: Carnet o código normalizado duplicado.}
        '403': {description: Forma heredada forbidden para CSRF o actor sin rol administrativo.}
  /api/patients/{patientId}:
    get:
      summary: Obtiene un paciente administrativo en el contrato heredado
      operationId: getLegacyPatient
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/PatientId'
      responses:
        '200': {description: Paciente encontrado, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyPatientSuccess'}}}}
        '404': {description: Estudiante no encontrado.}
    patch:
      summary: Actualiza un paciente sin cambiar su UUID
      operationId: updateLegacyPatient
      security: [{sessionCookie: [], csrfSession: []}]
      parameters:
        - $ref: '#/components/parameters/PatientId'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PatientRequest'}}}
      responses:
        '200': {description: Paciente actualizado, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyPatientIdSuccess'}}}}
        '404': {description: Estudiante no encontrado.}
        '409': {description: Carnet o código normalizado duplicado.}
        '403': {description: Forma heredada forbidden para CSRF o actor sin rol administrativo.}
  /api/specialties:
    get:
      summary: Lista especialidades activas en el contrato heredado
      operationId: listLegacySpecialties
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Especialidades activas, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyCatalogSuccess'}}}}
        '401': {description: Forma heredada no autenticada.}
        '403': {description: Forma heredada forbidden.}
  /api/my-specialties:
    get:
      summary: Lista especialidades vigentes del profesional actual
      operationId: listMySpecialties
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Especialidades vigentes, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyCatalogSuccess'}}}}
  /api/v1/catalogs/{kind}:
    get:
      summary: Lista un catálogo clínico activo
      operationId: listCatalog
      security: [{sessionCookie: []}]
      parameters:
        - name: kind
          in: path
          required: true
          schema: {type: string, enum: [CAREER, SPECIALTY, CONDITION, MEASUREMENT, TAG, DOCUMENT_TYPE]}
      responses:
        '200': {description: Catálogo activo, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogSuccess'}}}}
  /api/v1/admin/catalogs/{kind}:
    post:
      summary: Crea o actualiza lógicamente un catálogo como administrativo
      operationId: saveCatalog
      security: [{sessionCookie: [], csrfSession: []}]
      parameters:
        - name: kind
          in: path
          required: true
          schema: {type: string, enum: [CAREER, SPECIALTY, CONDITION, MEASUREMENT, TAG, DOCUMENT_TYPE]}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CatalogSaveRequest'}}}
      responses:
        '200': {description: Catálogo guardado, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogSuccess'}}}}
        '403': {$ref: '#/components/responses/CsrfInvalid'}
  /api/v1/auth/login:
    post:
      summary: Autentica credenciales y crea una sesión opaca en cookie HttpOnly
      operationId: login
      security:
        - csrfSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión creada; el token solo se entrega en cookie.
          headers:
            Set-Cookie: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginSuccess'}
        '401':
          description: Credenciales inválidas o límite de intentos aplicado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403': {$ref: '#/components/responses/CsrfInvalid'}
  /api/v1/profile:
    patch:
      summary: Actualiza nombre y correo tras comprobar la contraseña actual
      operationId: updateProfile
      security: [{sessionCookie: [], csrfSession: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ProfileUpdateRequest'}}}
      responses:
        '204':
          description: Perfil actualizado; todas las sesiones se revocan y la cookie actual se borra.
          headers: {Set-Cookie: {schema: {type: string}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '409': {description: El correo ya está usado por otra cuenta.}
        '403': {$ref: '#/components/responses/CsrfInvalid'}
  /api/v1/profile/password:
    post:
      summary: Cambia la contraseña tras comprobar la contraseña actual
      operationId: changePassword
      security: [{sessionCookie: [], csrfSession: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PasswordChangeRequest'}}}
      responses:
        '204':
          description: Contraseña cambiada; todas las sesiones se revocan y la cookie actual se borra.
          headers: {Set-Cookie: {schema: {type: string}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CsrfInvalid'}
  /api/v1/security/csrf:
    get:
      summary: Crea o recupera el token CSRF de la sesión HTTP actual
      operationId: getCsrfToken
      responses:
        '200':
          description: Token CSRF y metadatos de envío
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfSuccess'
  /api/v1/session:
    get:
      summary: Inspecciona el sujeto y autoridades de una sesión autenticada
      operationId: getSessionProbe
      responses:
        '200':
          description: Sesión autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/session/logout:
    post:
      summary: Invalida la sesión actual
      operationId: logout
      security:
        - csrfSession: []
      responses:
        '204':
          description: Sesión invalidada
        '403':
          $ref: '#/components/responses/CsrfInvalid'
  /api/me:
    get:
      summary: Contrato de compatibilidad de identidad del frontend actual
      operationId: legacyMe
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Usuario y rol prioritario activo.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LegacyMeSuccess'}
        '401':
          description: Forma heredada exacta {ok:false,error:unauthenticated}.
  /api/reports/compliance:
    get:
      summary: Consulta cumplimiento institucional por carrera y período académico
      operationId: institutionalCompliance
      security: [{sessionCookie: []}]
      parameters:
        - name: careerId
          in: query
          required: false
          schema: {type: string, format: uuid}
        - name: period
          in: query
          required: false
          schema: {type: string, maxLength: 80}
      responses:
        '200': {description: Cumplimiento por paciente inscrito, incluyendo pendientes., content: {application/json: {schema: {$ref: '#/components/schemas/LegacyComplianceSuccess'}}}}
        '400': {description: Período académico inválido.}
        '403': {description: Sólo administración o responsable de reportes.}
  /api/reports/daily-activity:
    get:
      summary: Agrega atenciones cerradas por día, tipo y especialidad
      operationId: dailyInstitutionalActivity
      security: [{sessionCookie: []}]
      parameters:
        - name: from
          in: query
          required: false
          schema: {type: string, format: date}
        - name: to
          in: query
          required: false
          schema: {type: string, format: date}
      responses:
        '200': {description: Agregados de sólo encuentros cerrados., content: {application/json: {schema: {$ref: '#/components/schemas/LegacyDailyActivitySuccess'}}}}
        '400': {description: Rango inválido o superior a 366 días.}
        '403': {description: Sólo administración o responsable de reportes.}
  /api/audit-events:
    get:
      summary: Consulta evidencia de auditoría sin exponer contenido clínico ni detalles sensibles
      operationId: listAuditEvents
      security: [{sessionCookie: []}]
      parameters:
        - name: from
          in: query
          required: false
          schema: {type: string, format: date}
        - name: to
          in: query
          required: false
          schema: {type: string, format: date}
        - name: actorId
          in: query
          required: false
          schema: {type: string, format: uuid}
        - name: action
          in: query
          required: false
          schema: {type: string}
        - name: resource
          in: query
          required: false
          schema: {type: string}
        - name: outcome
          in: query
          required: false
          schema: {type: string, enum: [SUCCESS, DENIED, FAILURE]}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
      responses:
        '200': {description: Eventos ordenados de más reciente a más antiguo., content: {application/json: {schema: {$ref: '#/components/schemas/LegacyAuditEventListSuccess'}}}}
        '400': {description: Filtros inválidos.}
        '403': {description: Sólo Auditor.}
  /api/vaccines:
    get:
      summary: Lista vacunas y su última versión de esquema
      operationId: listVaccines
      security: [{sessionCookie: []}]
      parameters:
        - name: includeInactive
          in: query
          required: false
          schema: {type: boolean, default: false}
      responses:
        '200': {description: Catálogo administrativo de vacunas., content: {application/json: {schema: {$ref: '#/components/schemas/LegacyVaccineListSuccess'}}}}
        '403': {description: Sólo Administración.}
    post:
      summary: Crea una vacuna y la primera versión de su esquema de dosis
      operationId: createVaccine
      security: [{sessionCookie: [], csrfSession: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/VaccineRequest'}}}
      responses:
        '201': {description: Vacuna creada., content: {application/json: {schema: {$ref: '#/components/schemas/LegacyVaccineIdSuccess'}}}}
        '400': {description: Esquema inválido.}
        '403': {description: Sólo Administración.}
  /api/vaccines/{vaccineId}:
    put:
      summary: Crea una versión de esquema y permite activar o desactivar una vacuna sin borrar historia
      operationId: updateVaccine
      security: [{sessionCookie: [], csrfSession: []}]
      parameters:
        - name: vaccineId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/VaccineRequest'}}}
      responses:
        '200': {description: Vacuna actualizada., content: {application/json: {schema: {$ref: '#/components/schemas/LegacyVaccineIdSuccess'}}}}
        '400': {description: Esquema inválido o vacuna inexistente.}
        '403': {description: Sólo Administración.}
  /api/vaccinations:
    post:
      summary: Registra una dosis aplicada y conserva aplicador, registrador y versión del esquema
      operationId: applyVaccinationDose
      security: [{sessionCookie: [], csrfSession: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/VaccinationApplicationRequest'}}}
      responses:
        '201': {description: Dosis registrada., content: {application/json: {schema: {$ref: '#/components/schemas/LegacyVaccinationApplicationSuccess'}}}}
        '400': {description: Dosis, orden, fecha o intervalo inválidos.}
        '403': {description: Sólo Administración o Médico de revisión; el aplicador debe ser válido.}
        '404': {description: Paciente inexistente.}
        '409': {description: Ya existe esa dosis para el paciente y vacuna.}
  /api/vaccination-card:
    get:
      summary: Consulta el carnet y estado de vacunación autorizado
      operationId: getVaccinationCard
      security: [{sessionCookie: []}]
      parameters:
        - name: patientId
          in: query
          required: false
          schema: {type: string, format: uuid}
          description: Requerido para Administración; un estudiante sólo puede consultar su propio carnet.
      responses:
        '200': {description: Carnet y estado calculado por esquema., content: {application/json: {schema: {$ref: '#/components/schemas/LegacyVaccinationCardSuccess'}}}}
        '403': {description: No autorizado para ese carnet.}
        '404': {description: Paciente inexistente.}
  /api/reports/vaccination-coverage:
    get:
      summary: Cobertura agregada por vacuna, carrera y período académico
      operationId: getVaccinationCoverage
      security: [{sessionCookie: []}]
      parameters:
        - name: careerId
          in: query
          required: false
          schema: {type: string, format: uuid}
        - name: academicPeriod
          in: query
          required: false
          schema: {type: string, maxLength: 80}
      responses:
        '200': {description: Cobertura institucional agregada., content: {application/json: {schema: {$ref: '#/components/schemas/LegacyVaccinationCoverageSuccess'}}}}
        '403': {description: Sólo Administración o Reportes.}
        '400': {description: Filtros inválidos.}
  /api/research/exports:
    post:
      summary: Descarga un conjunto de investigación seudonimizado y su diccionario
      operationId: exportPseudonymizedResearchDataset
      security: [{sessionCookie: [], csrfSession: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ResearchExportRequest'}}}
      responses:
        '200': {description: CSV dentro de ZIP o XLSX con hoja Dictionary; sin identificadores directos.}
        '400': {description: Finalidad, filtros o formato inválidos.}
        '403': {description: Sólo Administración o Responsable de Reportes.}
components:
  parameters:
    PatientId:
      name: patientId
      in: path
      required: true
      schema: {type: string, format: uuid}
  headers:
    RequestId:
      description: Identificador de trazabilidad aceptado o generado por el servidor.
      schema:
        type: string
  securitySchemes:
    csrfSession:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: Requiere la cookie de sesión obtenida junto con GET /api/v1/security/csrf.
    sessionCookie:
      type: apiKey
      in: cookie
      name: SALUD_U_SESSION
  responses:
    Unauthenticated:
      description: Falta una sesión autenticada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CsrfInvalid:
      description: Falta, expiró o no coincide el token CSRF.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ClinicalBackgroundVersion:
      type: object
      required: [id, versionNo, data, verificationStatus, recordedAt, recordedBy, changeReason]
      properties:
        id: {type: string, format: uuid}
        versionNo: {type: integer, minimum: 1}
        data: {type: object}
        verificationStatus: {type: string, enum: [CONFIRMED, NEEDS_REVIEW]}
        recordedAt: {type: string, format: date-time}
        recordedBy: {type: [string, 'null'], description: Nombre o correo del actor, según contrato de referencia.}
        changeReason: {type: string}
    MedicalAgendaAppointment:
      type: object
      required: [id, appointmentType, status, scheduledFor, checkedInAt, endsAt, specialty, specialtyCode, patient, encounter]
      properties:
        id: {type: string, format: uuid}
        appointmentType: {type: string, enum: [INITIAL, SPECIALTY, REFERRAL]}
        status: {type: string, enum: [SCHEDULED, CHECKED_IN, CANCELLED, NO_SHOW, ATTENDED]}
        scheduledFor: {type: string, format: date-time}
        checkedInAt: {type: [string, 'null'], format: date-time}
        endsAt: {type: [string, 'null'], format: date-time}
        specialty: {type: string}
        specialtyCode: {type: [string, 'null']}
        patient:
          type: object
          required: [id, carnet, registrationCode, fullName, birthDate, phone, email]
          properties:
            id: {type: string, format: uuid}
            carnet: {type: string}
            registrationCode: {type: string}
            fullName: {type: string}
            birthDate: {type: [string, 'null'], format: date}
            phone: {type: [string, 'null']}
            email: {type: [string, 'null']}
        encounter:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, status]
              properties:
                id: {type: string, format: uuid}
                status: {type: string, enum: [DRAFT, CLOSED, VOIDED]}
    MedicalEncounterStartSuccess:
      type: object
      required: [ok, data]
      properties:
        ok: {type: boolean, const: true}
        data:
          type: object
          required: [encounterId, status]
          properties:
            encounterId: {type: string, format: uuid}
            status: {type: string, enum: [DRAFT, CLOSED, VOIDED]}
    CatalogItem:
      type: object
      required: [id, code, name]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
    LegacyCatalogSuccess:
      type: object
      required: [ok, data]
      properties:
        ok: {type: boolean, const: true}
        data: {type: array, items: {$ref: '#/components/schemas/CatalogItem'}}
    CatalogSuccess:
      type: object
      required: [ok, data, error]
      properties:
        ok: {type: boolean, const: true}
        data: {oneOf: [{$ref: '#/components/schemas/CatalogItem'}, {type: array, items: {$ref: '#/components/schemas/CatalogItem'}}]}
        error: {type: 'null'}
    CatalogSaveRequest:
      type: object
      required: [code, name, active]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, pattern: '^[A-Za-z0-9_]{2,50}$'}
        name: {type: string}
        active: {type: boolean}
    PatientRequest:
      type: object
      properties:
        fullName: {type: string, maxLength: 160}
        carnet: {type: string, maxLength: 40}
        registrationCode: {type: string, maxLength: 40}
        birthDate: {type: string, format: date}
        phone: {type: string, maxLength: 40}
        email: {type: string, format: email, maxLength: 254}
        careerId: {type: string, format: uuid}
        academicPeriod: {type: string, maxLength: 30}
        enrollmentStart: {type: string, format: date}
    LegacyPatient:
      type: object
      required: [id, carnet, registrationCode, fullName, academicStatus, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        carnet: {type: string}
        registrationCode: {type: string}
        fullName: {type: string}
        birthDate: {type: [string, 'null'], format: date}
        phone: {type: [string, 'null']}
        email: {type: [string, 'null'], format: email}
        academicStatus: {type: string, enum: [ACTIVE, INACTIVE, GRADUATED, SUSPENDED]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        career: {oneOf: [{$ref: '#/components/schemas/CatalogItem'}, {type: 'null'}]}
        enrollment:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, academicPeriod, startedOn, status]
              properties:
                id: {type: string, format: uuid}
                academicPeriod: {type: string}
                startedOn: {type: string, format: date}
                status: {type: string}
    LegacyPatientSuccess:
      type: object
      required: [ok, data]
      properties: {ok: {type: boolean, const: true}, data: {$ref: '#/components/schemas/LegacyPatient'}}
    LegacyPatientListSuccess:
      type: object
      required: [ok, data]
      properties: {ok: {type: boolean, const: true}, data: {type: array, items: {$ref: '#/components/schemas/LegacyPatient'}}}
    LegacyPatientIdSuccess:
      type: object
      required: [ok, data]
      properties:
        ok: {type: boolean, const: true}
        data: {type: object, required: [id], properties: {id: {type: string, format: uuid}}}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password, writeOnly: true}
    ProfileUpdateRequest:
      type: object
      required: [displayName, email, currentPassword]
      properties:
        displayName: {type: string, minLength: 1, maxLength: 160}
        email: {type: string, format: email, maxLength: 254}
        currentPassword: {type: string, format: password, writeOnly: true}
    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: {type: string, format: password, writeOnly: true}
        newPassword: {type: string, format: password, writeOnly: true, minLength: 12, maxLength: 128}
    LoginSuccess:
      type: object
      required: [ok, data, error]
      properties:
        ok: {type: boolean, const: true}
        data:
          type: object
          required: [user]
          properties:
            user: {$ref: '#/components/schemas/LegacyUser'}
        error: {type: 'null'}
    LegacyMeSuccess:
      type: object
      required: [ok, user]
      properties:
        ok: {type: boolean, const: true}
        user: {$ref: '#/components/schemas/LegacyUser'}
    LegacyUser:
      type: object
      required: [id, email, name, role, clinicalRole]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        name: {type: string}
        role: {type: string, enum: [estudiante, medico, administrativo]}
        clinicalRole: {type: string, enum: [ADMINISTRATIVE, REPORTING_OFFICER, REVIEW_DOCTOR, SPECIALIST, STUDENT, AUDITOR]}
    LegacyComplianceSuccess:
      type: object
      required: [ok, data, error]
      properties:
        ok: {type: boolean, const: true}
        data:
          type: array
          items:
            type: object
            required: [patientId, carnet, fullName, careerId, careerName, academicPeriod, firstClosedEncounterAt, complianceStatus]
            properties:
              patientId: {type: string, format: uuid}
              carnet: {type: string}
              fullName: {type: string}
              careerId: {type: string, format: uuid}
              careerName: {type: string}
              academicPeriod: {type: string}
              firstClosedEncounterAt: {type: [string, 'null'], format: date-time}
              complianceStatus: {type: string, enum: [COMPLIANT, PENDING]}
        error: {type: 'null'}
    LegacyDailyActivitySuccess:
      type: object
      required: [ok, data, error]
      properties:
        ok: {type: boolean, const: true}
        data:
          type: array
          items:
            type: object
            required: [activityDay, encounterType, specialtyName, totalClosed]
            properties:
              activityDay: {type: string, format: date}
              encounterType: {type: string, enum: [INITIAL, SPECIALTY]}
              specialtyName: {type: [string, 'null']}
              totalClosed: {type: integer, format: int64, minimum: 0}
        error: {type: 'null'}
    LegacyAuditEventListSuccess:
      type: object
      required: [ok, data, error]
      properties:
        ok: {type: boolean, const: true}
        data:
          type: array
          items:
            type: object
            required: [id, occurredAt, actor, action, resource, resourceId, outcome, context]
            properties:
              id: {type: string, format: uuid}
              occurredAt: {type: string, format: date-time}
              actor:
                type: object
                required: [id, name, roles]
                properties:
                  id: {type: string, format: uuid}
                  name: {type: string}
                  roles: {type: array, items: {type: string}}
              action: {type: string}
              resource: {type: string}
              resourceId: {type: [string, 'null'], format: uuid}
              outcome: {type: string, enum: [SUCCESS, DENIED, FAILURE]}
              context: {type: string, description: Descripción operacional derivada; no contiene metadata cruda.}
        error: {type: 'null'}
    VaccineRequest:
      type: object
      required: [code, name, active, doses]
      properties:
        code: {type: string, minLength: 2, maxLength: 60}
        name: {type: string, minLength: 2, maxLength: 160}
        active: {type: boolean}
        doses:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [doseNumber, minimumIntervalDays]
            properties:
              doseNumber: {type: integer, minimum: 1, maximum: 20}
              minimumIntervalDays: {type: integer, minimum: 0, maximum: 3650}
    LegacyVaccineIdSuccess:
      type: object
      required: [ok, data, error]
      properties:
        ok: {type: boolean, const: true}
        data: {type: object, required: [id], properties: {id: {type: string, format: uuid}}}
        error: {type: 'null'}
    LegacyVaccineListSuccess:
      type: object
      required: [ok, data, error]
      properties:
        ok: {type: boolean, const: true}
        data:
          type: array
          items:
            type: object
            required: [id, code, name, active, schemaVersion, doses]
            properties:
              id: {type: string, format: uuid}
              code: {type: string}
              name: {type: string}
              active: {type: boolean}
              schemaVersion: {type: integer}
              doses: {type: array, items: {type: object, required: [doseNumber, minimumIntervalDays]}}
        error: {type: 'null'}
    VaccinationApplicationRequest:
      type: object
      required: [patientId, vaccineId, doseNumber, appliedOn, lot]
      properties:
        patientId: {type: string, format: uuid}
        vaccineId: {type: string, format: uuid}
        doseNumber: {type: integer, minimum: 1, maximum: 20}
        appliedOn: {type: string, format: date}
        lot: {type: string, minLength: 1, maxLength: 100}
        applicatorStaffId: {type: string, format: uuid, description: Obligatorio para Administración; un médico sólo puede indicar su propio personal.}
        intervalOverrideJustification: {type: string, minLength: 1, maxLength: 500, description: Obligatoria si no se cumple el intervalo mínimo.}
    LegacyVaccinationApplicationSuccess:
      type: object
      required: [ok, data, error]
      properties:
        ok: {type: boolean, const: true}
        data:
          type: object
          required: [id, intervalWarning, applicatorStaffId, registeredBy, appliedOn]
          properties:
            id: {type: string, format: uuid}
            intervalWarning: {type: boolean}
            applicatorStaffId: {type: string, format: uuid}
            registeredBy: {type: string, format: uuid}
            appliedOn: {type: string, format: date}
        error: {type: 'null'}
    LegacyVaccinationCardSuccess:
      type: object
      required: [ok, data, error]
      properties:
        ok: {type: boolean, const: true}
        data:
          type: object
          required: [patientId, carnet, fullName, vaccines]
          properties:
            patientId: {type: string, format: uuid}
            carnet: {type: string}
            fullName: {type: string}
            careerId: {type: [string, 'null'], format: uuid}
            careerName: {type: [string, 'null']}
            academicPeriod: {type: [string, 'null']}
            vaccines: {type: array, items: {type: object, required: [vaccineId, code, name, active, requiredDoseCount, completedDoseCount, status, appliedDoses]}}
        error: {type: 'null'}
    LegacyVaccinationCoverageSuccess:
      type: object
      required: [ok, data, error]
      properties:
        ok: {type: boolean, const: true}
        data:
          type: array
          items:
            type: object
            required: [vaccineId, vaccineCode, vaccineName, careerId, careerName, academicPeriod, totalStudents, completedSchedules, coveragePercentage]
        error: {type: 'null'}
    ResearchExportRequest:
      type: object
      required: [purpose, filters, format]
      properties:
        purpose: {type: string, minLength: 3, maxLength: 300}
        filters:
          type: object
          properties:
            from: {type: string, format: date}
            to: {type: string, format: date}
            careerId: {type: string, format: uuid}
            specialtyId: {type: string, format: uuid}
            vaccineId: {type: string, format: uuid}
        format: {type: string, enum: [CSV, XLSX], description: CSV produce ZIP con research-data.csv y dictionary.csv.}
    CsrfSuccess:
      type: object
      required: [ok, data, error]
      properties:
        ok: {type: boolean, const: true}
        data:
          type: object
          required: [token, headerName, parameterName]
          properties:
            token: {type: string}
            headerName: {type: string, example: X-CSRF-TOKEN}
            parameterName: {type: string, example: _csrf}
        error: {type: 'null'}
    SessionSuccess:
      type: object
      required: [ok, data, error]
      properties:
        ok: {type: boolean, const: true}
        data:
          type: object
          required: [subject, authorities]
          properties:
            subject: {type: string}
            authorities:
              type: array
              items: {type: string}
        error: {type: 'null'}
    ErrorResponse:
      type: object
      required: [ok, data, error]
      properties:
        ok: {type: boolean, const: false}
        data: {type: 'null'}
        error:
          type: object
          required: [code, message, details, requestId]
          properties:
            code: {type: string, example: CSRF_INVALID}
            message: {type: string}
            details: {type: object, additionalProperties: true}
            requestId: {type: string}
