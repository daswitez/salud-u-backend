          type: object
          description: Presente solo con paginated=true. Sin este parámetro se conserva ok/data.
          required: [hasMore, nextCursor]
          properties:
            hasMore: {type: boolean}
            nextCursor: {type: [string, 'null']}
    VaccineRequest:
      type: object
      required: [code, name, active, doses]
