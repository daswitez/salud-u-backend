        appointments: {type: array, items: {type: object}, description: 'id/status/appointment_type/scheduled_for/checked_in_at/assigned_staff_id/availability_slot(specialty(name) o null)/specialty/isAssignedToMe; solo citas propias, fecha/id descendente.'}
        referrals: {type: array, items: {type: object}, description: 'id/source_encounter_id/specialty_id/assigned_staff_id/status/priority/reason/comment_for_specialist/created_at/specialty; emitidas de revisión autorizada o asignadas al especialista en área vigente. Creación/id descendente.'}
